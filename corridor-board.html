<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Theatre Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{height:100%;margin:0;background:var(--canvas);}
  body{padding:28px 36px;box-sizing:border-box;}
  .cb-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .cb-org{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--ink-900);}
  .cb-dept{font-size:14px;color:var(--ink-500);margin-top:2px;}
  .cb-clock{text-align:right;}
  .cb-time{font-family:var(--font-mono);font-size:30px;font-weight:600;color:var(--teal-700);line-height:1;}
  .cb-date{font-size:13px;color:var(--ink-500);margin-top:4px;}
  .cb-bh{display:inline-block;margin-top:22px;background:var(--status-oncall-bg);color:var(--status-oncall);
    font-weight:700;font-size:14px;padding:8px 18px;border-radius:var(--r-sm);}

  .cb-coord-wrap{display:flex;justify-content:center;margin-bottom:22px;}
  .cb-coord-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    padding:14px 32px;text-align:center;min-width:280px;}
  .cb-coord-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-300);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:6px;}
  .cb-coord-name{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--ink-900);}

  .cb-theatre-sub{font-size:13.5px;color:var(--ink-700);line-height:1.6;margin-bottom:10px;}
  .cb-theatre-sub b{color:var(--ink-900);}

  .cb-theatres{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px;}
  .cb-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);padding:16px 18px;}
  .cb-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .cb-card-head .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cb-card-head .dot.available{background:var(--status-available);}
  .cb-card-head .dot.inlist{background:var(--status-inlist);animation:pulse-dot 1.8s infinite;}
  .cb-card-head .dot.closed{background:var(--status-closed);}
  .cb-theatre-name{font-family:var(--font-display);font-weight:800;font-size:19px;flex:1;}
  .cb-team{display:flex;flex-direction:column;gap:8px;}
  .cb-team-block{border-top:1px solid var(--ink-100);padding-top:8px;}
  .cb-team-block:first-child{border-top:none;padding-top:0;}
  .cb-team-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin-bottom:4px;}
  .cb-person{font-size:14.5px;color:var(--ink-900);line-height:1.5;}
  .cb-person.cb-lead{font-weight:700;}
  .cb-empty{font-size:13px;color:var(--ink-300);font-style:italic;}
  .cb-list-tag{display:inline-block;font-family:var(--font-mono);font-size:9.5px;background:var(--ink-100);color:var(--ink-500);
    padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}

  .cb-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px;}
  .cb-strip .card{padding:14px 18px;}
  .cb-strip .card-label{font-size:11px;}
  .cb-strip .card-value{font-size:17px;line-height:1.5;}
  .cb-oncall-card{grid-column:1/-1;}
  .cb-oncall-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
  .cb-oncall-item .oc-role{font-family:var(--font-mono);font-size:10px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .cb-oncall-item .oc-name{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900);}

  .cb-noboard{color:var(--ink-500);font-size:16px;padding:40px 0;text-align:center;}

  /* Team Board — sized up a little from the dashboard version since
     this is read (and typed on) from a shared screen, not a phone. */
  .cb-tb-card{margin-top:24px;}
  .tb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .tb-title{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;}
  .tb-toggle{background:none;border:none;color:var(--teal-600);font-size:13px;font-weight:600;
    cursor:pointer;padding:0;text-decoration:underline;}
  .tb-list{display:flex;flex-direction:column;gap:14px;max-height:260px;overflow-y:auto;margin-bottom:16px;padding-right:4px;}
  .tb-msg{display:flex;gap:12px;align-items:flex-start;}
  .tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12px;flex-shrink:0;}
  .tb-body{flex:1;min-width:0;}
  .tb-meta{font-size:12px;color:var(--ink-500);margin-bottom:2px;}
  .tb-meta strong{color:var(--ink-700);font-weight:600;}
  .tb-text{font-size:15px;color:var(--ink-900);line-height:1.45;overflow-wrap:break-word;}
  .tb-del{background:none;border:none;color:var(--ink-300);cursor:pointer;font-size:17px;line-height:1;padding:2px;flex-shrink:0;}
  .tb-del:hover{color:var(--status-oncall);}
  .tb-form{display:flex;gap:10px;}
  .tb-form input{flex:1;font-family:var(--font-body);font-size:15px;padding:11px 16px;border-radius:var(--r-pill);
    border:1px solid var(--ink-150);background:var(--canvas);color:var(--ink-900);}
  .tb-date-group{margin-bottom:18px;}
  .tb-date-group:last-child{margin-bottom:0;}
  .tb-date-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:8px;}
</style>
</head>
<body>
<div id="boardRoot"></div>

<script type="module">
  import { requireSession } from "./js/auth.js";
  import { getDepartment, listTheatres } from "./js/department.js";
  import { loadWeek, mondayOfCurrentWeek } from "./js/rota.js";
  import { loadNursingWeek } from "./js/nursing-rota.js";
  import { postMessage, deleteMessage, watchTodayMessages, loadArchive, buildArchiveGroups } from "./js/messages.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

  // Any signed-in account can open the board (a "viewer" login left
  // permanently open on the corridor screen is the intended setup) —
  // requireSession() still runs so an unattended device without a
  // saved session lands back on the login page rather than showing
  // nothing. `user` is needed here (unlike before) because this page
  // now has its own postable Team Board.
  const { user, profile } = await requireSession();
  const dept = await getDepartment(profile.departmentId);

  const theatres = await listTheatres(profile.departmentId);

  function localIso(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function isoPlusDays(mondayIso, i) {
    const d = new Date(mondayIso + "T00:00:00");
    d.setDate(d.getDate() + i);
    return d;
  }
  const ALL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const todayIso = localIso(new Date());

  let odpRota = {}, nursingRota = {};

  async function loadBoth() {
    const weekStart = mondayOfCurrentWeek();
    const [odpWeek, nursingWeek] = await Promise.all([
      loadWeek(profile.departmentId, weekStart),
      loadNursingWeek(profile.departmentId, weekStart)
    ]);
    odpRota = odpWeek.data || {};
    nursingRota = nursingWeek.data || {};
  }

  function theatreInfo(day, t) {
    const odp1 = odpRota[`${day}_${t.id}_odp1`] || "";
    const odp2 = odpRota[`${day}_${t.id}_odp2`] || "";
    const anaes = odpRota[`${day}_${t.id}_anaes`] || "";
    const odpList = odpRota[`${day}_${t.id}_list`] || "";

    const nurses = [1, 2, 3, 4].map(n => nursingRota[`${day}_${t.id}_nurse${n}`]).filter(Boolean);
    const hcas = [1, 2].map(n => nursingRota[`${day}_${t.id}_hca${n}`]).filter(Boolean);
    const surgeon = nursingRota[`${day}_${t.id}_surgeon`] || "";
    const nursingList = nursingRota[`${day}_${t.id}_list`] || "";

    const hasAny = !!(odp1 || odp2 || anaes || nurses.length || hcas.length || surgeon);
    const closedFlag = [odpList, nursingList].some(l => l.includes("NO LIST") || l.includes("NO SURGEON") || l.includes("MAINTENANCE"));
    let status = "available";
    if (hasAny) status = closedFlag ? "closed" : "inlist";

    return { odp1, odp2, anaes, odpList, nurses, hcas, surgeon, nursingList, status };
  }

  function theatreCardHtml(day, t) {
    const i = theatreInfo(day, t);
    const odpRows = [i.odp1, i.odp2].filter(Boolean).map(n => `<div class="cb-person">${n}</div>`).join("");
    const nursingRows = [...i.nurses.map(n => `<div class="cb-person">${n}</div>`),
      ...i.hcas.map(n => `<div class="cb-person">${n}</div>`)].filter(Boolean).join("");

    return `<div class="cb-card">
      <div class="cb-card-head">
        <span class="dot ${i.status}"></span>
        <span class="cb-theatre-name">${t.name}</span>
      </div>
      <div class="cb-theatre-sub">
        Anaesthetist: <b>${i.anaes || "—"}</b><br>
        Surgeon: <b>${i.surgeon || "—"}</b>
      </div>
      <div class="cb-team">
        <div class="cb-team-block">
          <div class="cb-team-label">ODP ${i.odpList ? `<span class="cb-list-tag">${i.odpList}</span>` : ""}</div>
          ${odpRows || `<div class="cb-empty">No allocation</div>`}
        </div>
        <div class="cb-team-block">
          <div class="cb-team-label">Nursing team ${i.nursingList ? `<span class="cb-list-tag">${i.nursingList}</span>` : ""}</div>
          ${nursingRows || `<div class="cb-empty">No allocation</div>`}
        </div>
      </div>
    </div>`;
  }

  // ---- Page skeleton, built once ------------------------------------------
  // The clock ticks every second, but rebuilding the whole page every
  // second would blow away whatever someone's mid-typing into the Team
  // Board form below. So the skeleton (head + body containers) is built
  // exactly once; only #cbTime/#cbDate update every second, #boardBody
  // updates every 5 minutes (or on load), and #teamBoardCard updates
  // only when the message list actually changes.
  const root = document.getElementById("boardRoot");
  root.innerHTML = `
    <div class="cb-head">
      <div>
        <div class="cb-org">${dept.hospitalName || ""}</div>
        <div class="cb-dept">${dept.name || "Theatres"}</div>
        <div id="cbBhBanner"></div>
      </div>
      <div class="cb-clock">
        <div class="cb-time" id="cbTime"></div>
        <div class="cb-date" id="cbDate"></div>
      </div>
    </div>
    <div id="boardBody"></div>
    <div class="cb-card cb-tb-card" id="teamBoardCard"></div>
  `;

  function tickClock() {
    const now = new Date();
    document.getElementById("cbTime").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("cbDate").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }

  function renderBody() {
    const now = new Date();
    const todayIsoNow = localIso(now);
    const day = ALL_DAYS[(now.getDay() + 6) % 7];
    const isWeekend = day === "Saturday" || day === "Sunday";

    document.getElementById("cbBhBanner").innerHTML = (dept.bankHolidays && dept.bankHolidays[todayIsoNow])
      ? `<div class="cb-bh">Bank holiday</div>` : "";

    const body = document.getElementById("boardBody");

    if (!theatres.length) {
      body.innerHTML = `<div class="cb-noboard">No theatres configured yet — add them in Administration.</div>`;
      return;
    }

    if (isWeekend) {
      const odpOc = [odpRota[`${day}_oncall_odp1`], odpRota[`${day}_oncall_odp2`]].filter(Boolean).join(", ") || "—";
      const odpOcAnaes = odpRota[`${day}_oncall_anaes`] || "—";
      const odpWlOdp = odpRota[`${day}_wl_odp`] || "—";
      const odpWlAnaes = odpRota[`${day}_wl_anaes`] || "—";

      const nurOc = [1, 2, 3].map(n => nursingRota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const nurOcHca = nursingRota[`${day}_oncall_hca`] || "—";
      const nurOcSurgeon = nursingRota[`${day}_oncall_surgeon`] || "—";
      const nurWl = [1, 2, 3].map(n => nursingRota[`${day}_wl_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const nurWlHca = nursingRota[`${day}_wl_hca`] || "—";
      const nurWlSurgeon = nursingRota[`${day}_wl_surgeon`] || "—";

           // Six cards: ODP/Nurses/HCA share an "On call" box and a "Waiting
      // list" box (neither of them is a single named lead the way an
      // anaesthetist or surgeon is), while Anaesthetist and Surgeon each
      // get their own box for both on call and the waiting list.
      body.innerHTML = `<div class="cb-strip">
        <div class="card"><div class="card-label">On call</div><div class="card-value" style="font-size:16px;">ODP: ${odpOc}<br>Nurses: ${nurOc}<br>HCA: ${nurOcHca}</div></div>
        <div class="card"><div class="card-label">Anaesthetist on call</div><div class="card-value">${odpOcAnaes}</div></div>
        <div class="card"><div class="card-label">Surgeon on call</div><div class="card-value">${nurOcSurgeon}</div></div>
        <div class="card"><div class="card-label">Waiting list</div><div class="card-value" style="font-size:16px;">ODP: ${odpWlOdp}<br>Nurses: ${nurWl}<br>HCA: ${nurWlHca}</div></div>
        <div class="card"><div class="card-label">Waiting list anaesthetist</div><div class="card-value">${odpWlAnaes}</div></div>
        <div class="card"><div class="card-label">Waiting list surgeon</div><div class="card-value">${nurWlSurgeon}</div></div>
      </div>`;

    } else {
      const theatreCardsHtml = theatres.map(t => theatreCardHtml(day, t)).join("");

      const supportOdps = [odpRota[`${day}_support1`], odpRota[`${day}_support2`], odpRota[`${day}_support3`]].filter(Boolean).join(", ") || "—";
      const odpOc = odpRota[`${day}_oncall_odp`] || "—";
      const odpOcAnaes = odpRota[`${day}_oncall_anaes`] || "—";
      const odpOcHome = !!odpRota[`${day}_oncall_home`];

      const supportNurses = [1, 2].map(n => nursingRota[`${day}_support_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const supportHcas = [1, 2].map(n => nursingRota[`${day}_support_hca${n}`]).filter(Boolean).join(", ") || "—";
      const nurOc = [1, 2, 3].map(n => nursingRota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const nurOcHca = nursingRota[`${day}_oncall_hca`] || "—";
      const coordinator = nursingRota[`${day}_coordinator`] || "—";
      const oncallSurgeon = nursingRota[`${day}_oncall_surgeon`] || "—";

      body.innerHTML = `
        <div class="cb-coord-wrap">
          <div class="cb-coord-card">
            <div class="cb-coord-label">Coordinator</div>
            <div class="cb-coord-name">${coordinator}</div>
          </div>
        </div>
        <div class="cb-theatres">${theatreCardsHtml}</div>
        <div class="cb-strip">
          <div class="card"><div class="card-label">ODP support</div><div class="card-value">${supportOdps}</div></div>
        <div class="card"><div class="card-label">Nursing support</div><div class="card-value">Nurses: ${supportNurses}<br>HCAs: ${supportHcas}</div></div>

          <div class="card cb-oncall-card">
            <div class="card-label">On call${odpOcHome ? ` <span class="cb-list-tag">ODP FROM HOME</span>` : ""}</div>
            <div class="card-label">On call</div>
 <div class="cb-oncall-item"><div class="oc-role">Anaesthetist</div><div class="oc-name">${odpOcAnaes}</div></div>
              <div class="cb-oncall-item"><div class="oc-role">Surgeon</div><div class="oc-name">${oncallSurgeon}</div></div>
              <div class="cb-oncall-item"><div class="oc-role">ODP</div><div class="oc-name">${odpOc}</div></div>
             <div class="cb-oncall-item"><div class="oc-role">ODP${odpOcHome ? ` <span class="cb-list-tag">FROM HOME</span>` : ""}</div><div class="oc-name">${odpOc}</div></div>
 
              <div class="cb-oncall-item"><div class="oc-role">HCA</div><div class="oc-name">${nurOcHca}</div></div>
            </div>
          </div>
        </div>
      `;
    }
  }

  // ---- Team Board -----------------------------------------------------
  // A third, fully separate board from both dashboards' — its own
  // Firestore collection (departments/{deptId}/theatreMessages) — since
  // this screen is shared by the whole department (both teams and
  // anyone else who walks past with a login), not owned by either team.
  // Same open-posting rule as the other two boards: anyone signed into
  // the department can post; only the author or an admin can delete.
  const THEATRE_MESSAGES = "theatreMessages";
  let todayMessages = [];
  let boardMode = "today"; // "today" | "archive"
  let archiveGroups = null;
  let tbError = null;

  function initials(name) {
    return (name || "?").split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase();
  }
  function formatMsgTime(ts, clientTime) {
    if (ts?.toDate) return ts.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    if (clientTime) return new Date(clientTime).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    return "sending…";
  }
  // Message text is always set via textContent after insertion (see the
  // two loops below), never interpolated into the HTML string — so a
  // posted message can never be interpreted as markup.
  function msgRowHtml(id, displayName, createdAt, clientTime, canDelete) {
    return `<div class="tb-msg">
      <div class="tb-avatar">${initials(displayName)}</div>
      <div class="tb-body">
        <div class="tb-meta"><strong>${displayName || "Someone"}</strong> · ${formatMsgTime(createdAt, clientTime)}</div>
        <div class="tb-text" data-msg-id="${id}"></div>
      </div>
      ${canDelete ? `<button class="tb-del" data-del="${id}" title="Delete">×</button>` : ""}
    </div>`;
  }

  async function toggleBoardMode() {
    boardMode = boardMode === "today" ? "archive" : "today";
    renderTeamBoard();
    if (boardMode === "archive" && !archiveGroups) {
      const msgs = await loadArchive(profile.departmentId, todayIso, 300, THEATRE_MESSAGES);
      archiveGroups = buildArchiveGroups(msgs);
      renderTeamBoard();
    }
  }

  function renderTeamBoard() {
    const el = document.getElementById("teamBoardCard");
    if (!el) return;

    if (tbError) {
      el.innerHTML = `<div class="tb-head"><span class="tb-title">Team Board</span></div>
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div class="es-title">Live updates aren't connecting</div>
          <div class="es-sub">${tbError.code || tbError.message || String(tbError)}</div>
        </div>`;
      return;
    }

    const headHtml = `<div class="tb-head"><span class="tb-title">Team Board</span>
      <button class="tb-toggle" id="tbToggleBtn">${boardMode === "today" ? "Archive" : "Today"}</button></div>`;

    if (boardMode === "archive") {
      let bodyHtml;
      if (!archiveGroups) {
        bodyHtml = `<div class="skeleton skeleton-text w-40"></div><div class="skeleton skeleton-text w-80" style="margin-top:10px;"></div>`;
      } else if (!archiveGroups.length) {
        bodyHtml = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M15 4v5h5"/></svg>
          <div class="es-title">Nothing archived yet</div>
          <div class="es-sub">Once today ends, anything posted here moves into the archive automatically.</div>
        </div>`;
      } else {
        bodyHtml = `<div class="tb-list" style="max-height:340px;">${archiveGroups.map(g => `
          <div class="tb-date-group">
            <div class="tb-date-label">${new Date(g.dateKey + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</div>
            ${g.messages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, false)).join("")}
          </div>`).join("")}</div>`;
      }
      el.innerHTML = headHtml + bodyHtml;
      if (archiveGroups) {
        archiveGroups.flatMap(g => g.messages).forEach(m => {
          const node = el.querySelector(`[data-msg-id="${m.id}"]`);
          if (node) node.textContent = m.text;
        });
      }
    } else {
      const listHtml = todayMessages.length
        ? `<div class="tb-list">${todayMessages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, m.uid === user.uid || profile.role === "admin")).join("")}</div>`
        : `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-9.9 8.25 8.5 8.5 0 01-6.32-3.17L3 21l1.42-4.24a8.5 8.5 0 01-.9-3.76 8.38 8.38 0 018.25-9.9 8.5 8.5 0 018.23 8.4z"/></svg>
            <div class="es-title">No messages yet today</div>
            <div class="es-sub">Anyone can post here — it's shared by the whole department.</div>
          </div>`;
      el.innerHTML = `${headHtml}${listHtml}
        <form class="tb-form" id="tbForm">
          <input type="text" id="tbInput" placeholder="Share something with everyone…" maxlength="500" autocomplete="off">
          <button class="btn btn-primary btn-sm" type="submit">Post</button>
        </form>`;
      todayMessages.forEach(m => {
        const node = el.querySelector(`[data-msg-id="${m.id}"]`);
        if (node) node.textContent = m.text;
      });

      el.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this message?")) return;
          await deleteMessage(profile.departmentId, btn.dataset.del, THEATRE_MESSAGES);
        });
      });
      document.getElementById("tbForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("tbInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        try {
          await postMessage(profile.departmentId, user.uid, profile.displayName || "Someone", text, todayIso, THEATRE_MESSAGES);
        } catch (err) {
          tbError = err;
          renderTeamBoard();
        }
      });
      const listEl = el.querySelector(".tb-list");
      if (listEl) listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById("tbToggleBtn").addEventListener("click", toggleBoardMode);
  }

  tickClock();
  renderBody();
  renderTeamBoard();
  await loadBoth();
  renderBody();

  // Clock ticks every second (cheap — two textContent writes, never
  // touches the Team Board). Rota data refreshes every 5 minutes, same
  // as before — this screen is unattended, so it has to catch changes
  // on its own. Team Board is separately live via watchTodayMessages,
  // so a new message appears the instant it's posted, not on a timer.
  setInterval(tickClock, 1000);
  setInterval(async () => { await loadBoth(); renderBody(); }, 5 * 60 * 1000);
   watchTodayMessages(profile.departmentId, todayIso, (msgs) => {
    todayMessages = msgs;
    tbError = null;
    if (boardMode === "today") renderTeamBoard();
  }, THEATRE_MESSAGES, (err) => {
    tbError = err;
    renderTeamBoard();
  });

  // Keep the screen from sleeping/dimming while this page is open — this
  // is meant to sit permanently on a corridor TV. Wake Lock is well
  // supported (Chrome, Edge, and Safari 16.4+/iOS 16.4+), but it's still
  // only a second layer: the device's own display/sleep settings are the
  // main thing to check, since Wake Lock can't override those, and older
  // or unusual browsers without the API just silently skip this — the
  // page still works identically, it just relies on the device settings
  // alone in that case. A lock is also released automatically whenever
  // the tab goes into the background (e.g. switching apps), so it's
  // re-requested on visibilitychange to pick back up once this tab is
  // visible again.
  if ("wakeLock" in navigator) {
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (err) {
        // Permission denied, battery saver, or similar — nothing to do
        // but rely on the device's own sleep settings instead.
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (wakeLock !== null && document.visibilityState === "visible") requestWakeLock();
    });
  }
</script>

</body>
