<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Theatre Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* This page is a standalone full-bleed wall board, not a normal app
     screen — no sidebar/topbar (renderShell is never called), designed
     to sit permanently open on a corridor TV/monitor logged in as a
     viewer account. Large type throughout since it's read from a
     distance, not held in the hand. */
  html,body{height:100%;margin:0;background:var(--canvas);}
  body{padding:28px 36px;box-sizing:border-box;}
  .cb-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:24px;
    padding-bottom:20px;border-bottom:1px solid var(--ink-150);}
  .cb-org{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--ink-900);}
  .cb-dept{font-size:14px;color:var(--ink-500);margin-top:2px;}
  .cb-clock{text-align:right;}
  .cb-time{font-family:var(--font-mono);font-size:30px;font-weight:600;color:var(--teal-700);line-height:1;}
  .cb-date{font-size:13px;color:var(--ink-500);margin-top:4px;}
  .cb-open-app{display:inline-block;margin-top:8px;font-family:var(--font-body);font-size:12px;font-weight:600;
    color:var(--teal-600);text-decoration:none;}
  .cb-open-app:hover{text-decoration:underline;}
  .cb-bh{display:inline-block;margin-top:22px;background:var(--status-oncall-bg);color:var(--status-oncall);
    font-weight:700;font-size:14px;padding:8px 18px;border-radius:var(--r-sm);}

  .cb-updated{font-size:11px;color:var(--ink-300);margin-top:2px;}

  .cb-head-coord{display:flex;justify-content:center;}
  .cb-coord-card{padding:10px 28px;text-align:center;min-width:220px;}
  .cb-coord-label{font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.7);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:4px;}
  .cb-coord-name{font-family:var(--font-display);font-weight:800;font-size:20px;color:#fff;}

  .cb-theatre-sub{font-size:13.5px;color:var(--ink-700);line-height:1.6;margin-bottom:10px;}
  .cb-theatre-sub b{color:var(--ink-900);}

  /* "Today in Cardiothoracic History" — a small ambient fact, not a
     status item, so it's kept to a single compact card rather than its
     own section: a kicker line, the title, and a two-line-max summary
     (clamped, not scrollable) so it can never push the theatre grid
     below the fold on the wall board. Only rendered on days the pilot
     history batch actually covers — see js/theatre-history.js. */
  .th-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    padding:10px 16px;margin-bottom:14px;border-left:3px solid var(--teal-500);box-shadow:var(--shadow-sm);}
  .th-kicker{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--teal-600);margin-bottom:3px;}
  .th-title{font-family:var(--font-display);font-weight:800;font-size:14.5px;color:var(--ink-900);margin-bottom:2px;}
  .th-summary{font-size:12px;color:var(--ink-700);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .cb-theatres{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px;}
  .cb-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);padding:16px 18px;
    border-left:4px solid var(--card-accent, var(--ink-150));box-shadow:var(--shadow-sm);}
  .cb-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .cb-card-head .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cb-card-head .dot.available{background:var(--status-available);}
  .cb-card-head .dot.inlist{background:var(--status-inlist);animation:pulse-dot 1.8s infinite;}
  .cb-card-head .dot.closed{background:var(--status-closed);}
  .cb-theatre-name{font-family:var(--font-display);font-weight:800;font-size:19px;flex:1;}
  .cb-team{display:flex;flex-direction:column;gap:8px;}
  .cb-team-block{border-top:1px solid var(--ink-100);padding-top:8px;}
  .cb-team-block:first-child{border-top:none;padding-top:0;}
  .cb-team-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin-bottom:4px;}
  .cb-person{font-size:14.5px;color:var(--ink-900);line-height:1.5;}
  .cb-person.cb-lead{font-weight:700;}
  .cb-empty{font-size:13px;color:var(--ink-300);font-style:italic;}
.cb-closed-label{font-family:var(--font-mono);font-size:19px;font-weight:700;letter-spacing:.03em;
  color:var(--status-closed);text-transform:uppercase;text-align:center;padding:18px 0 10px;}

  .cb-list-tag{display:inline-block;font-family:var(--font-mono);font-size:9.5px;background:var(--ink-100);color:var(--ink-500);
    padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}

  .cb-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px;}
  .cb-strip .card{padding:14px 18px;}
  .cb-strip .card-label{font-size:11px;}
  .cb-strip .card-value{font-size:17px;line-height:1.5;}
  .cb-oncall-card{grid-column:1/-1;}
  .cb-oncall-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
  .cb-oncall-item .oc-role{font-family:var(--font-mono);font-size:10px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .cb-oncall-item .oc-name{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900);}

  .cb-noboard{color:var(--ink-500);font-size:16px;padding:40px 0;text-align:center;}

  /* This board is built for a wide wall-mounted display, but it's also
     everyone's PWA landing page — so on a phone-width screen the header's
     three columns (hospital name / coordinator / clock) no longer have
     room side by side and the clock gets pushed off the edge. Stack them
     instead of squeezing. */
  @media (max-width:700px){
    .cb-head{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
    .cb-head-coord{align-self:center;}
    .cb-clock{text-align:left;}
  }

  /* Night mode (weeknight/Friday on-call only) and the restructured
     weekend layout (waiting list stacked above on call) share the
     board's normal card/strip styling but need a couple of their own
     pieces: the pulsing "ON CALL" banner, night mode's larger centred
     card grid (there's nothing else on screen so it can afford to be
     bigger), and weekend's section labels splitting the two groups. */
  .nm-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 34px;}
  .nm-banner-dot{width:10px;height:10px;border-radius:50%;background:var(--status-oncall);animation:pulse-dot 1.8s infinite;}
  .nm-banner-text{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--status-oncall);}
  .nm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:920px;margin:0 auto;}
  .nm-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    padding:26px 20px;text-align:center;box-shadow:var(--shadow-sm);}
  .nm-role{font-family:var(--font-mono);font-size:11px;color:var(--ink-300);text-transform:uppercase;
    letter-spacing:.07em;margin-bottom:10px;}
  .nm-name{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--ink-900);line-height:1.3;}

  .wk-section{margin-bottom:26px;}
  .wk-label{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:12px;}

  /* Team Board — sized up a little from the dashboard version since
     this is read (and typed on) from a shared screen, not a phone. */
  .cb-tb-card{margin-top:24px;}
  .tb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .tb-title{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;}
  .tb-toggle{background:none;border:none;color:var(--teal-600);font-size:13px;font-weight:600;
    cursor:pointer;padding:0;text-decoration:underline;}
  .tb-list{display:flex;flex-direction:column;gap:14px;max-height:260px;overflow-y:auto;margin-bottom:16px;padding-right:4px;}
  .tb-msg{display:flex;gap:12px;align-items:flex-start;}
  .tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12px;flex-shrink:0;}
  .tb-body{flex:1;min-width:0;}
  .tb-meta{font-size:12px;color:var(--ink-500);margin-bottom:2px;}
  .tb-meta strong{color:var(--ink-700);font-weight:600;}
  .tb-text{font-size:15px;color:var(--ink-900);line-height:1.45;overflow-wrap:break-word;}
  .tb-del{background:none;border:none;color:var(--ink-300);cursor:pointer;font-size:17px;line-height:1;padding:2px;flex-shrink:0;}
  .tb-del:hover{color:var(--status-oncall);}
  .tb-form{display:flex;gap:10px;}
  .tb-form input{flex:1;font-family:var(--font-body);font-size:15px;padding:11px 16px;border-radius:var(--r-pill);
    border:1px solid var(--ink-150);background:var(--canvas);color:var(--ink-900);}
  .tb-date-group{margin-bottom:18px;}
  .tb-date-group:last-child{margin-bottom:0;}
  .tb-date-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:8px;}
</style>
</head>
<body class="canvas-wash">
<div id="boardRoot"></div>

<script type="module">
  import { requireSession } from "./js/auth.js";
  import { getDepartment, listTheatres } from "./js/department.js";
  import { loadWeek, mondayOfCurrentWeek } from "./js/rota.js";
  import { loadNursingWeek } from "./js/nursing-rota.js";
  import { postMessage, deleteMessage, watchTodayMessages, loadArchive, buildArchiveGroups } from "./js/messages.js";
  import { applyTheme } from "./js/theme.js";
  import { registerServiceWorker } from "./js/pwa.js";
  import { todaysHistoryEntry } from "./js/theatre-history.js";
  applyTheme();
  registerServiceWorker();

  // Any signed-in account can open the board (a "viewer" login left
  // permanently open on the corridor screen is the intended setup) —
  // requireSession() still runs so an unattended device without a
  // saved session lands back on the login page rather than showing
  // nothing. `user` is needed here (unlike before) because this page
  // now has its own postable Team Board.
   const { user, profile } = await requireSession();
  // Fired together — dept and theatres don't depend on each other.
  const deptPromise = getDepartment(profile.departmentId);
  const theatresPromise = listTheatres(profile.departmentId);
  const dept = await deptPromise;
  const theatres = await theatresPromise;

  function localIso(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function isoPlusDays(mondayIso, i) {
    const d = new Date(mondayIso + "T00:00:00");
    d.setDate(d.getDate() + i);
    return d;
  }
  const ALL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const todayIso = localIso(new Date());

  // ---- Schedule: when the board shows the on-call-only / weekend view --
  // Mon-Thu: daytime 06:30-19:00, then night (on-call only) 19:00 until
  //   06:30 the next morning, using that day's on-call data throughout.
  // Fri: daytime 06:30-19:00, then night 19:00 until Saturday 07:00 (not
  //   06:30 — Friday's on-call runs an extra 30 minutes into Saturday
  //   morning to meet the weekend view), using Friday's on-call data.
  // Sat: weekend view (waiting list + on call) 07:00-Sunday 07:00, using
  //   Saturday's data all the way through, day and night alike.
  // Sun: weekend view 07:00 until Monday 06:30, using Sunday's data.
  // The tricky part isn't the day-mode hours, it's that three of these
  // windows cross midnight into the next calendar day — so "what mode is
  // it, and whose data do I show" can't just be answered from today's
  // weekday alone. Below checks two things for `now`: does today's own
  // window (day/night/weekend) claim it, and failing that, does
  // *yesterday's* window claim it because it hasn't ended yet.
  function atTime(base, h, m) {
    const d = new Date(base);
    d.setHours(h, m, 0, 0);
    return d;
  }

  function getDisplayState(now) {
    const todayIdx = (now.getDay() + 6) % 7; // Monday=0 .. Sunday=6
    const todayName = ALL_DAYS[todayIdx];
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    const yestIdx = (yesterday.getDay() + 6) % 7;
    const yestName = ALL_DAYS[yestIdx];

    // Does a window that STARTS today already claim `now`?
    if (todayIdx <= 4) { // Mon-Fri: night starts 19:00
      if (now >= atTime(now, 19, 0)) return { mode: "night", dataDay: todayName };
    } else { // Sat/Sun: weekend view starts 07:00
      if (now >= atTime(now, 7, 0)) return { mode: "weekend", dataDay: todayName };
    }

    // Otherwise, does YESTERDAY's window carry over into this morning?
    if (yestIdx <= 3) { // yesterday Mon-Thu: night ends 06:30 today
      if (now < atTime(now, 6, 30)) return { mode: "night", dataDay: yestName };
    } else if (yestIdx === 4) { // yesterday Friday: night ends 07:00 today (Saturday)
      if (now < atTime(now, 7, 0)) return { mode: "night", dataDay: yestName };
    } else if (yestIdx === 5) { // yesterday Saturday: weekend ends 07:00 today (Sunday)
      if (now < atTime(now, 7, 0)) return { mode: "weekend", dataDay: yestName };
    } else { // yesterday Sunday: weekend ends 06:30 today (Monday)
      if (now < atTime(now, 6, 30)) return { mode: "weekend", dataDay: yestName };
    }

    return { mode: "day", dataDay: todayName };
  }

  let odpRota = {}, nursingRota = {};

  async function loadBoth() {
    const weekStart = mondayOfCurrentWeek();
    const [odpWeek, nursingWeek] = await Promise.all([
      loadWeek(profile.departmentId, weekStart),
      loadNursingWeek(profile.departmentId, weekStart)
    ]);
    odpRota = odpWeek.data || {};
    nursingRota = nursingWeek.data || {};
    const el = document.getElementById("cbUpdated");
    if (el) el.textContent = `Updated ${new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
  }

  function theatreInfo(day, t) {
    const odp1 = odpRota[`${day}_${t.id}_odp1`] || "";
    const odp2 = odpRota[`${day}_${t.id}_odp2`] || "";
    const anaes = odpRota[`${day}_${t.id}_anaes`] || "";
    const odpList = odpRota[`${day}_${t.id}_list`] || "";

    const nurses = [1, 2, 3, 4].map(n => nursingRota[`${day}_${t.id}_nurse${n}`]).filter(Boolean);
    const hcas = [1, 2].map(n => nursingRota[`${day}_${t.id}_hca${n}`]).filter(Boolean);
    const surgeon = nursingRota[`${day}_${t.id}_surgeon`] || "";
    const nursingList = nursingRota[`${day}_${t.id}_list`] || "";

        const hasAny = !!(odp1 || odp2 || anaes || nurses.length || hcas.length || surgeon);
    // Some list-type labels (NO LIST/NO SURGEON/MAINTENANCE) mean
    // "closed" outright, even if a leftover allocation is still sitting
    // in one of its boxes — namedClosed wins regardless of hasAny for
    // exactly that "closed but nobody's cleared the leftover allocation"
    // case. Any OTHER list-type label (a custom one like ENT — someone
    // else's specialty using the theatre that day) only gets the same
    // closed treatment once there's genuinely nobody from this
    // department's own rotas in it either.
    const namedClosed = [odpList, nursingList].some(l => l.includes("NO LIST") || l.includes("NO SURGEON") || l.includes("MAINTENANCE"));
    const closedFlag = namedClosed || (!hasAny && !!(odpList || nursingList));
    let status = "available";
    if (closedFlag) status = "closed";
    else if (hasAny) status = "inlist";

        return { odp1, odp2, anaes, odpList, nurses, hcas, surgeon, nursingList, status, hasAny };
  }

  // Same status colours as the dot, so the accent bar down the card's
  // left edge is scannable from across the corridor without having to
  // spot the small dot itself.
  const STATUS_ACCENT = { available: "var(--status-available)", inlist: "var(--status-inlist)", closed: "var(--status-closed)" };

  // NO LIST/NO SURGEON/MAINTENANCE already read fine on their own; any
  // other label (a custom list type like ENT) reads better with "List"
  // appended so it's clear that's what's occupying the theatre, not a
  // stray word.
  function noStaffLabel(listType) {
    const upper = listType.toUpperCase();
    if (upper.includes("NO LIST") || upper.includes("NO SURGEON") || upper.includes("MAINTENANCE")) return listType;
    return `${listType} List`;
  }

  function theatreCardHtml(day, t) {
    const i = theatreInfo(day, t);
    const accent = `style="--card-accent:${STATUS_ACCENT[i.status]}"`;

    // A theatre marked closed (whether by a named "no work happening"
    // label, or simply because a list type is set but nobody from this
    // department is in it) isn't running that day at all — showing a
    // full card of "Anaesthetist: —", "Surgeon: —", and two "No
    // allocation" blocks is just noise at that point. Show the list-type
    // label on its own instead, nothing else.
    if (i.status === "closed" && !i.hasAny) {
      const label = noStaffLabel(i.odpList || i.nursingList);
      return `<div class="cb-card" ${accent}>
        <div class="cb-card-head">
          <span class="dot closed"></span>
          <span class="cb-theatre-name">${t.name}</span>
        </div>
        <div class="cb-closed-label">${label}</div>
      </div>`;
    }

    const odpRows = [i.odp1, i.odp2].filter(Boolean).map(n => `<div class="cb-person">${n}</div>`).join("");

    const nursingRows = [...i.nurses.map(n => `<div class="cb-person">${n}</div>`),
      ...i.hcas.map(n => `<div class="cb-person">${n}</div>`)].filter(Boolean).join("");

    return `<div class="cb-card" ${accent}>
      <div class="cb-card-head">
        <span class="dot ${i.status}"></span>
        <span class="cb-theatre-name">${t.name}</span>
      </div>
      <div class="cb-theatre-sub">
        Anaesthetist: <b>${i.anaes || "—"}</b><br>
        Surgeon: <b>${i.surgeon || "—"}</b>
      </div>
      <div class="cb-team">
        <div class="cb-team-block">
          <div class="cb-team-label">SODP ${i.odpList ? `<span class="cb-list-tag">${i.odpList}</span>` : ""}</div>
          ${odpRows || `<div class="cb-empty">No allocation</div>`}
        </div>
        <div class="cb-team-block">
          <div class="cb-team-label">Nursing team ${i.nursingList ? `<span class="cb-list-tag">${i.nursingList}</span>` : ""}</div>
          ${nursingRows || `<div class="cb-empty">No allocation</div>`}
        </div>
      </div>
    </div>`;
  }

  // ---- Page skeleton, built once ------------------------------------------
  // The clock ticks every second, but rebuilding the whole page every
  // second would blow away whatever someone's mid-typing into the Team
  // Board form below. So the skeleton (head + body containers) is built
  // exactly once; only #cbTime/#cbDate update every second, #boardBody
  // updates every 5 minutes (or on load), and #teamBoardCard updates
  // only when the message list actually changes.
  const root = document.getElementById("boardRoot");
  // Small, unobtrusive way back into the rest of the app — this page is
  // now everyone's landing page after login, but deliberately has no
  // sidebar of its own (it's meant to also run as a bare kiosk display).
  // Board-only accounts don't get this: they're meant to stay here.
  const openAppLinkHtml = profile.role !== "board"
    ? `<a href="dashboard.html" class="cb-open-app">Open full app →</a>` : "";
  root.innerHTML = `
    <div class="cb-head">
      <div>
        <div class="cb-org">${dept.hospitalName || ""} <span class="live-badge"><span class="ecg-wrap"><svg class="ecg-trace" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0,20 H40 L46,4 L52,36 L58,20 H100"/><path d="M0,20 H40 L46,4 L52,36 L58,20 H100" transform="translate(100,0)"/></svg></span>LIVE</span></div>
        <div class="cb-dept">${dept.name || "Theatres"}</div>
        <div id="cbBhBanner"></div>
      </div>
      <div class="cb-head-coord" id="cbHeadCoord"></div>
      <div class="cb-clock">
        <div class="cb-time" id="cbTime"></div>
        <div class="cb-date" id="cbDate"></div>
        <div class="cb-updated" id="cbUpdated"></div>
        ${openAppLinkHtml}
      </div>
    </div>
    <div id="boardBody"></div>
    <div class="cb-card cb-tb-card" id="teamBoardCard"></div>
  `;

  function tickClock() {
    const now = new Date();
    document.getElementById("cbTime").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("cbDate").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }

  function renderBody() {
    const now = new Date();
    const todayIsoNow = localIso(now);
    const state = getDisplayState(now);
    const day = state.dataDay;

    document.getElementById("cbBhBanner").innerHTML = (dept.bankHolidays && dept.bankHolidays[todayIsoNow])
      ? `<div class="cb-bh">Bank holiday</div>` : "";

    const body = document.getElementById("boardBody");
    const headCoord = document.getElementById("cbHeadCoord");
    // Only the day view has a coordinator to show; night/weekend clear
    // this slot out rather than leaving a stale name up.
    headCoord.innerHTML = "";

    const historyEntry = todaysHistoryEntry(now);
    const historyHtml = historyEntry ? `
      <div class="th-card">
        <div class="th-kicker">Today in cardiothoracic history · ${historyEntry.year}</div>
        <div class="th-title">${historyEntry.title}</div>
        <div class="th-summary">${historyEntry.summary}</div>
      </div>` : "";

    if (state.mode === "night") {
      // On-call only — no theatre grid, no coordinator, no support,
      // since none of that is relevant once theatres are closed for
      // the night. Same six roles as the weekday on-call strip, just
      // given the whole screen since there's nothing else to show.
      const anaes = odpRota[`${day}_oncall_anaes`] || "—";
      const surgeonCardiac = nursingRota[`${day}_oncall_surgeon`] || "—";
      const surgeonThoracic = nursingRota[`${day}_oncall_surgeon_thoracic`] || "—";
      const odpOc = odpRota[`${day}_oncall_odp`] || "—";
      const odpOcHome = !!odpRota[`${day}_oncall_home`];
      const nurOc = [1, 2, 3].map(n => nursingRota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const nurOcHca = nursingRota[`${day}_oncall_hca`] || "—";

      body.innerHTML = `
        ${historyHtml}
        <div class="nm-banner"><span class="nm-banner-dot"></span><span class="nm-banner-text">On call</span></div>
        <div class="nm-grid">
          <div class="nm-card"><div class="nm-role">Anaesthetist</div><div class="nm-name">${anaes}</div></div>
          <div class="nm-card"><div class="nm-role">Surgeon (Cardiac)</div><div class="nm-name">${surgeonCardiac}</div></div>
          <div class="nm-card"><div class="nm-role">Surgeon (Thoracic)</div><div class="nm-name">${surgeonThoracic}</div></div>
          <div class="nm-card"><div class="nm-role">SODP${odpOcHome ? ` <span class="cb-list-tag">FROM HOME</span>` : ""}</div><div class="nm-name">${odpOc}</div></div>
          <div class="nm-card"><div class="nm-role">Nurses</div><div class="nm-name">${nurOc}</div></div>
          <div class="nm-card"><div class="nm-role">HCA</div><div class="nm-name">${nurOcHca}</div></div>
        </div>
      `;
      return;
    }

    if (state.mode === "weekend") {
      const odpOc = [odpRota[`${day}_oncall_odp1`], odpRota[`${day}_oncall_odp2`]].filter(Boolean).join(", ") || "—";
      const odpOcAnaes = odpRota[`${day}_oncall_anaes`] || "—";
      const odpWlOdpRaw = odpRota[`${day}_wl_odp`] || "";
      const odpWlAnaesRaw = odpRota[`${day}_wl_anaes`] || "";

      const nurOc = [1, 2, 3].map(n => nursingRota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
      const nurOcHca = nursingRota[`${day}_oncall_hca`] || "—";
      const nurOcSurgeonCardiac = nursingRota[`${day}_oncall_surgeon`] || "—";
      const nurOcSurgeonThoracic = nursingRota[`${day}_oncall_surgeon_thoracic`] || "—";
      const nurWlRaw = [1, 2, 3].map(n => nursingRota[`${day}_wl_nurse${n}`]).filter(Boolean);
      const nurWlHcaRaw = nursingRota[`${day}_wl_hca`] || "";
      const nurWlSurgeonRaw = nursingRota[`${day}_wl_surgeon`] || "";

      const hasWeekendList = !!(odpWlOdpRaw || odpWlAnaesRaw || nurWlRaw.length || nurWlHcaRaw || nurWlSurgeonRaw);
      const weekendListHtml = hasWeekendList
        ? `<div class="cb-strip">
            <div class="card"><div class="card-label">Waiting list</div><div class="card-value" style="font-size:16px;">SODP: ${odpWlOdpRaw || "—"}<br>Nurses: ${nurWlRaw.join(", ") || "—"}<br>HCA: ${nurWlHcaRaw || "—"}</div></div>
            <div class="card"><div class="card-label">Waiting list anaesthetist</div><div class="card-value">${odpWlAnaesRaw || "—"}</div></div>
            <div class="card"><div class="card-label">Waiting list surgeon</div><div class="card-value">${nurWlSurgeonRaw || "—"}</div></div>
          </div>`
        : `<div class="card"><div class="card-value" style="font-size:16px;color:var(--ink-300);font-style:italic;">No list this weekend</div></div>`;

      body.innerHTML = `
        ${historyHtml}
        <div class="wk-section">
          <div class="wk-label">Weekend waiting list</div>
          ${weekendListHtml}
        </div>
        <div class="wk-section">
          <div class="wk-label">On call</div>
          <div class="cb-strip">
            <div class="card"><div class="card-label">On call</div><div class="card-value" style="font-size:16px;">SODP: ${odpOc}<br>Nurses: ${nurOc}<br>HCA: ${nurOcHca}</div></div>
            <div class="card"><div class="card-label">Anaesthetist on call</div><div class="card-value">${odpOcAnaes}</div></div>
            <div class="card"><div class="card-label">Cardiac surgeon on call</div><div class="card-value">${nurOcSurgeonCardiac}</div></div>
            <div class="card"><div class="card-label">Thoracic surgeon on call</div><div class="card-value">${nurOcSurgeonThoracic}</div></div>
          </div>
        </div>
      `;
      return;
    }

    // state.mode === "day" — normal working-hours view.
    if (!theatres.length) {
      body.innerHTML = `<div class="cb-noboard">No theatres configured yet — add them in Administration.</div>`;
      return;
    }

    const theatreCardsHtml = theatres.map(t => theatreCardHtml(day, t)).join("");

    const supportOdps = [odpRota[`${day}_support1`], odpRota[`${day}_support2`], odpRota[`${day}_support3`]].filter(Boolean).join(", ") || "—";
    const odpOc = odpRota[`${day}_oncall_odp`] || "—";
    const odpOcAnaes = odpRota[`${day}_oncall_anaes`] || "—";
    const odpOcHome = !!odpRota[`${day}_oncall_home`];

    const supportNurses = [1, 2].map(n => nursingRota[`${day}_support_nurse${n}`]).filter(Boolean).join(", ") || "—";
    const supportHcas = [1, 2].map(n => nursingRota[`${day}_support_hca${n}`]).filter(Boolean).join(", ") || "—";
    const nurOc = [1, 2, 3].map(n => nursingRota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
    const nurOcHca = nursingRota[`${day}_oncall_hca`] || "—";
    const coordinator = nursingRota[`${day}_coordinator`] || "—";
    const oncallSurgeonCardiac = nursingRota[`${day}_oncall_surgeon`] || "—";
    const oncallSurgeonThoracic = nursingRota[`${day}_oncall_surgeon_thoracic`] || "—";

    headCoord.innerHTML = `
      <div class="cb-coord-card card hero-card">
        <div class="cb-coord-label">Coordinator</div>
        <div class="cb-coord-name">${coordinator}</div>
      </div>
    `;

    body.innerHTML = `
      ${historyHtml}
      <div class="cb-theatres">${theatreCardsHtml}</div>
      <div class="cb-strip">
        <div class="card"><div class="card-label">SODP support</div><div class="card-value">${supportOdps}</div></div>
        <div class="card"><div class="card-label">Nursing support</div><div class="card-value">Nurses: ${supportNurses}<br>HCAs: ${supportHcas}</div></div>
        <div class="card cb-oncall-card">
          <div class="card-label">On call</div>
          <div class="cb-oncall-grid">
            <div class="cb-oncall-item"><div class="oc-role">Anaesthetist</div><div class="oc-name">${odpOcAnaes}</div></div>
            <div class="cb-oncall-item"><div class="oc-role">Surgeon (Cardiac)</div><div class="oc-name">${oncallSurgeonCardiac}</div></div>
            <div class="cb-oncall-item"><div class="oc-role">Surgeon (Thoracic)</div><div class="oc-name">${oncallSurgeonThoracic}</div></div>
            <div class="cb-oncall-item"><div class="oc-role">SODP${odpOcHome ? ` <span class="cb-list-tag">FROM HOME</span>` : ""}</div><div class="oc-name">${odpOc}</div></div>
            <div class="cb-oncall-item"><div class="oc-role">Nurses</div><div class="oc-name">${nurOc}</div></div>
            <div class="cb-oncall-item"><div class="oc-role">HCA</div><div class="oc-name">${nurOcHca}</div></div>
          </div>
        </div>
      </div>
    `;
  }

  // ---- Team Board -----------------------------------------------------
  // A third, fully separate board from both dashboards' — its own
  // Firestore collection (departments/{deptId}/theatreMessages) — since
  // this screen is shared by the whole department (both teams and
  // anyone else who walks past with a login), not owned by either team.
  // Same open-posting rule as the other two boards: anyone signed into
  // the department can post; only the author or an admin can delete.
  const THEATRE_MESSAGES = "theatreMessages";
  let todayMessages = [];
  let boardMode = "today"; // "today" | "archive"
  let archiveGroups = null;
  let tbError = null;

  function initials(name) {
    return (name || "?").split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase();
  }
  function formatMsgTime(ts, clientTime) {
    if (ts?.toDate) return ts.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    if (clientTime) return new Date(clientTime).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    return "sending…";
  }
  // Message text is always set via textContent after insertion (see the
  // two loops below), never interpolated into the HTML string — so a
  // posted message can never be interpreted as markup.
  function msgRowHtml(id, displayName, createdAt, clientTime, canDelete) {
    return `<div class="tb-msg">
      <div class="tb-avatar">${initials(displayName)}</div>
      <div class="tb-body">
        <div class="tb-meta"><strong>${displayName || "Someone"}</strong> · ${formatMsgTime(createdAt, clientTime)}</div>
        <div class="tb-text" data-msg-id="${id}"></div>
      </div>
      ${canDelete ? `<button class="tb-del" data-del="${id}" title="Delete">×</button>` : ""}
    </div>`;
  }

  async function toggleBoardMode() {
    boardMode = boardMode === "today" ? "archive" : "today";
    renderTeamBoard();
    if (boardMode === "archive" && !archiveGroups) {
      const msgs = await loadArchive(profile.departmentId, todayIso, 300, THEATRE_MESSAGES);
      archiveGroups = buildArchiveGroups(msgs);
      renderTeamBoard();
    }
  }

  function renderTeamBoard() {
    const el = document.getElementById("teamBoardCard");
    if (!el) return;

    if (tbError) {
      el.innerHTML = `<div class="tb-head"><span class="tb-title">Team Board</span></div>
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div class="es-title">Live updates aren't connecting</div>
          <div class="es-sub" style="word-break:break-word;">${tbError.message || tbError.code || String(tbError)}</div>
        </div>`;
      return;
    }

    const headHtml = `<div class="tb-head"><span class="tb-title">Team Board</span>
      <button class="tb-toggle" id="tbToggleBtn">${boardMode === "today" ? "Archive" : "Today"}</button></div>`;

    if (boardMode === "archive") {
      let bodyHtml;
      if (!archiveGroups) {
        bodyHtml = `<div class="skeleton skeleton-text w-40"></div><div class="skeleton skeleton-text w-80" style="margin-top:10px;"></div>`;
      } else if (!archiveGroups.length) {
        bodyHtml = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M15 4v5h5"/></svg>
          <div class="es-title">Nothing archived yet</div>
          <div class="es-sub">Once today ends, anything posted here moves into the archive automatically.</div>
        </div>`;
      } else {
        bodyHtml = `<div class="tb-list" style="max-height:340px;">${archiveGroups.map(g => `
          <div class="tb-date-group">
            <div class="tb-date-label">${new Date(g.dateKey + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</div>
            ${g.messages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, false)).join("")}
          </div>`).join("")}</div>`;
      }
      el.innerHTML = headHtml + bodyHtml;
      if (archiveGroups) {
        archiveGroups.flatMap(g => g.messages).forEach(m => {
          const node = el.querySelector(`[data-msg-id="${m.id}"]`);
          if (node) node.textContent = m.text;
        });
      }
    } else {
      const listHtml = todayMessages.length
        ? `<div class="tb-list">${todayMessages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, m.uid === user.uid || profile.role === "admin")).join("")}</div>`
        : `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-9.9 8.25 8.5 8.5 0 01-6.32-3.17L3 21l1.42-4.24a8.5 8.5 0 01-.9-3.76 8.38 8.38 0 018.25-9.9 8.5 8.5 0 018.23 8.4z"/></svg>
            <div class="es-title">No messages yet today</div>
            <div class="es-sub">Anyone can post here — it's shared by the whole department.</div>
          </div>`;
      el.innerHTML = `${headHtml}${listHtml}
        <form class="tb-form" id="tbForm">
          <input type="text" id="tbInput" placeholder="Share something with everyone…" maxlength="500" autocomplete="off">
          <button class="btn btn-primary btn-sm" type="submit">Post</button>
        </form>`;
      todayMessages.forEach(m => {
        const node = el.querySelector(`[data-msg-id="${m.id}"]`);
        if (node) node.textContent = m.text;
      });

      el.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this message?")) return;
          await deleteMessage(profile.departmentId, btn.dataset.del, THEATRE_MESSAGES);
        });
      });
      document.getElementById("tbForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("tbInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        try {
          await postMessage(profile.departmentId, user.uid, profile.displayName || "Someone", text, todayIso, THEATRE_MESSAGES);
        } catch (err) {
          tbError = err;
          renderTeamBoard();
        }
      });
      const listEl = el.querySelector(".tb-list");
      if (listEl) listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById("tbToggleBtn").addEventListener("click", toggleBoardMode);
  }

  tickClock();
  renderBody();
  renderTeamBoard();
  await loadBoth();
  renderBody();

  // Clock ticks every second (cheap — two textContent writes, never
  // touches the Team Board). renderBody() itself is also cheap — it
  // only touches already-loaded odpRota/nursingRota — so it's re-run
  // every minute to catch the day/night/weekend switch close to on
  // time, separately from the rota data refetch below, which stays on
  // its slower 5-minute cadence since that's the one making a network
  // call.
  setInterval(tickClock, 1000);
  setInterval(renderBody, 60 * 1000);
  setInterval(async () => { await loadBoth(); renderBody(); }, 5 * 60 * 1000);
  watchTodayMessages(profile.departmentId, todayIso, (msgs) => {
    todayMessages = msgs;
    tbError = null;
    if (boardMode === "today") renderTeamBoard();
  }, THEATRE_MESSAGES, (err) => {
    tbError = err;
    renderTeamBoard();
  });

  // Keep the screen from sleeping/dimming while this page is open — this
  // is meant to sit permanently on a corridor TV. Wake Lock is well
  // supported (Chrome, Edge, and Safari 16.4+/iOS 16.4+), but it's still
  // only a second layer: the device's own display/sleep settings are the
  // main thing to check, since Wake Lock can't override those, and older
  // or unusual browsers without the API just silently skip this — the
  // page still works identically, it just relies on the device settings
  // alone in that case. A lock is also released automatically whenever
  // the tab goes into the background (e.g. switching apps), so it's
  // re-requested on visibilitychange to pick back up once this tab is
  // visible again.
  if ("wakeLock" in navigator) {
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (err) {
        // Permission denied, battery saver, or similar — nothing to do
        // but rely on the device's own sleep settings instead.
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (wakeLock !== null && document.visibilityState === "visible") requestWakeLock();
    });
  }

  // Second layer, for devices/browsers where Wake Lock isn't supported
  // (older embedded browsers, some kiosk setups). A continuously
  // playing video is a well-established signal that stops many OSes
  // and browsers treating the device as idle — it's how sites like
  // Netflix/YouTube keep a laptop from sleeping mid-playback. Rather
  // than shipping a video file (which is one more thing a hospital
  // firewall could in principle block, and adds weight to the page),
  // the "video" is generated entirely on the fly from a tiny 2x2
  // canvas that repaints once a second — no network request at all,
  // same-origin, nothing to whitelist. It's a backup, not a
  // replacement: Wake Lock above is the more direct signal where it's
  // supported, this just covers the gap where it isn't.
  (function keepAliveVideo() {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 2;
      const ctx = canvas.getContext("2d");
      let toggle = false;
      function paint() {
        toggle = !toggle;
        ctx.fillStyle = toggle ? "#000000" : "#010101";
        ctx.fillRect(0, 0, 2, 2);
      }
      paint();
      if (!canvas.captureStream) return; // unsupported browser — skip silently
      const stream = canvas.captureStream(1);
      const video = document.createElement("video");
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("aria-hidden", "true");
      video.style.cssText = "position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;";
      document.body.appendChild(video);
      video.play().catch(() => {});
      setInterval(paint, 1000);
    } catch (err) {
      // Any failure here just means this backup layer isn't active —
      // the page still works identically otherwise.
    }
  })();
</script>
</body>
</html>
