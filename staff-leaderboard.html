<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Staff Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .empty-note{color:var(--ink-500);font-size:13.5px;padding:20px 0;}

  .lb-group{border:1px solid var(--ink-150);border-radius:var(--r-lg);background:var(--surface);
    margin-bottom:14px;overflow:hidden;}
  .lb-group-title{cursor:pointer;list-style:none;padding:14px 18px;font-family:var(--font-display);
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
  .lb-group-title::-webkit-details-marker{display:none;}
  .lb-group-title::after{content:"\2212";font-family:var(--font-mono);color:var(--ink-500);font-size:16px;}
  .lb-group:not([open]) .lb-group-title::after{content:"+";}
  .lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:0 18px 18px;}
  .lb-card{background:var(--canvas);border:1px solid var(--ink-150);border-radius:var(--r-md);padding:14px;}
  .lb-cat{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:10px;}
  .lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .lb-row{display:flex;align-items:center;gap:10px;}
  .lb-rank{font-family:var(--font-mono);font-weight:700;font-size:11px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-100);color:var(--ink-500);}
  .lb-row:first-child .lb-rank{background:var(--teal-100);color:var(--teal-700);}
  .lb-name{font-size:13px;font-weight:600;color:var(--ink-900);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-value{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--ink-700);flex-shrink:0;}
  .lb-empty{color:var(--ink-500);font-size:12.5px;margin:0;padding:0 18px 18px;}

  /* ---- Monthly Reports ---- */
  .mr-section{border:1px solid var(--ink-150);border-radius:var(--r-lg);background:var(--surface);
    box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden;}
  .mr-head{padding:14px 18px;border-bottom:1px solid var(--ink-150);display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .mr-head-left{display:flex;align-items:center;gap:12px;}
  .mr-title{font-family:var(--font-display);font-weight:800;font-size:14px;}
  .hl-launch{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:12.5px;
    font-weight:700;color:#fff;background:var(--teal-600);border:none;border-radius:999px;padding:7px 14px;cursor:pointer;}
  .hl-launch:hover{background:var(--teal-700);}
  .hl-launch svg{width:13px;height:13px;}

  /* ---- Highlights slideshow (full-screen overlay) ---- */
  .hl-overlay{position:fixed;inset:0;z-index:200;background:#0B1A18;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;}
  .hl-overlay[hidden]{display:none;}
  .hl-stage{position:relative;width:100%;max-width:1360px;aspect-ratio:16/9;border-radius:20px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .hl-progress-row{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:5px;z-index:5;}
  .hl-progress-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;}
  .hl-progress-seg .fill{height:100%;width:0%;background:#fff;border-radius:2px;}
  .hl-progress-seg.done .fill{width:100%;}
  @keyframes hlFillbar{from{width:0%;}to{width:100%;}}
  .hl-exit{position:absolute;top:14px;right:14px;z-index:6;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);color:#fff;font-family:var(--font-body);font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:999px;cursor:pointer;}
  .hl-exit:hover{background:rgba(255,255,255,.22);}
  .hl-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:60px 48px;opacity:0;transform:translateX(40px);transition:opacity .5s ease,transform .5s ease;
    background:linear-gradient(135deg, var(--sc1), var(--sc2));pointer-events:none;}
  .hl-slide.active{opacity:1;transform:translateX(0);pointer-events:auto;}
  .hl-kicker{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.14em;
    color:rgba(255,255,255,.75);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .hl-kicker svg{width:15px;height:15px;stroke:rgba(255,255,255,.85);}
  .hl-headline{font-family:var(--font-display);font-weight:800;color:#fff;line-height:1.1;text-wrap:balance;
    font-size:clamp(30px,4.6vw,56px);}
  .hl-headline .num{font-size:clamp(56px,10vw,108px);display:block;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .hl-sub{margin-top:16px;font-size:clamp(15px,2vw,21px);color:rgba(255,255,255,.85);max-width:52ch;line-height:1.5;}
  .hl-person{margin-top:22px;display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 26px 10px 10px;}
  .hl-avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--teal-700);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:17px;
    flex-shrink:0;}
  .hl-person span{color:#fff;font-weight:700;font-size:22px;}
  .hl-list{margin-top:22px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px;}
  .hl-list-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 22px 9px 9px;}
  .hl-list-row .hl-rank{font-family:var(--font-mono);font-weight:700;font-size:15px;width:36px;height:36px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:rgba(255,255,255,.9);color:var(--teal-700);}
  .hl-list-name{flex:1;text-align:left;color:#fff;font-weight:700;font-size:20px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .hl-list-val{font-family:var(--font-mono);font-weight:700;color:#fff;font-size:19px;flex-shrink:0;}
  .hl-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;}
  .hl-ctrl-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .hl-ctrl-btn:hover{background:rgba(255,255,255,.2);}
  .hl-ctrl-btn svg{width:15px;height:15px;}
  .hl-empty{color:#fff;font-family:var(--font-body);font-size:15px;text-align:center;max-width:40ch;}
  .mr-month-nav{display:flex;align-items:center;gap:10px;}
  .mr-month-nav button{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--ink-500);
    background:var(--canvas);border:1px solid var(--ink-150);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;}
  .mr-month-nav button:hover{background:var(--ink-100);}
  .mr-month-cur{font-family:var(--font-mono);font-weight:600;font-size:12.5px;color:var(--ink-900);min-width:120px;text-align:center;}
  .mr-body{padding:18px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:680px){.mr-body{grid-template-columns:1fr;}}
  .mr-body.mr-full{grid-template-columns:1fr;}
  .mr-card{background:var(--canvas);border:1px solid var(--ink-150);border-radius:var(--r-md);padding:16px;}
  .mr-card h4{font-family:var(--font-display);font-weight:700;font-size:13px;margin:0 0 3px;}
  .mr-card .mr-sub{font-size:11px;color:var(--ink-500);margin-bottom:12px;}
  .mr-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .mr-bar-label{width:88px;flex-shrink:0;font-size:11.5px;font-weight:600;color:var(--ink-700);text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mr-bar-track{flex:1;height:15px;background:var(--ink-100);border-radius:4px;overflow:hidden;}
  .mr-bar-fill{height:100%;border-radius:4px;}
  .mr-bar-val{width:22px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-700);
    font-variant-numeric:tabular-nums;}
  .mr-donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;}
  .mr-legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;}
  .mr-legend-row{display:flex;align-items:center;gap:6px;}
  .mr-legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .mr-legend-name{color:var(--ink-700);font-weight:600;}
  .mr-legend-val{color:var(--ink-500);font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="shellRoot"></div>

<script type="module">
  import { requireSession, blockBoardOnly } from "./js/auth.js";
  import { renderShell } from "./js/shell.js";
  import { applyTheme } from "./js/theme.js";
  import {
    loadStaffInsights, buildLeaderboardHtml, buildDeptMonthlyReport,
    currentMonthKey, shiftMonthKey, monthLabel, pickBadgeHighlights, buildLeaderboardRankings
  } from "./js/staff-insights.js";
  import { loadTheatreIntelligence } from "./js/insights.js";
  import { loadNursingTheatreIntelligence } from "./js/nursing-insights.js";
  import { mondayOfCurrentWeek } from "./js/rota.js";
  applyTheme();

  const { user, profile } = await requireSession();
  await blockBoardOnly(profile);

  const insights = await loadStaffInsights(profile.departmentId);
  profile.departmentName = insights.dept?.name || "Department";

  const content = renderShell({ profile, activePage: "staffLeaderboard", title: "Staff Leaderboard" });

  content.innerHTML = `
    <div class="mr-section">
      <div class="mr-head">
        <div class="mr-head-left">
          <div class="mr-title">Monthly Reports</div>
          <button type="button" class="hl-launch" id="hlLaunchBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>
            Play Highlights
          </button>
        </div>
        <div class="mr-month-nav">
          <button type="button" id="mrPrev">‹</button>
          <span class="mr-month-cur" id="mrMonthLabel"></span>
          <button type="button" id="mrNext">›</button>
        </div>
      </div>
      <div class="mr-body" id="mrBody"></div>
    </div>
    <div id="leaderboardArea"></div>

    <div class="hl-overlay" id="hlOverlay" hidden>
      <div class="hl-stage" id="hlStage">
        <div class="hl-progress-row" id="hlProgressRow"></div>
        <button type="button" class="hl-exit" id="hlExitBtn">✕ Exit</button>
        <div id="hlSlides"></div>
      </div>
      <div class="hl-controls">
        <button type="button" class="hl-ctrl-btn" id="hlPrevBtn" title="Previous" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="hl-ctrl-btn" id="hlPlayBtn" title="Pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button type="button" class="hl-ctrl-btn" id="hlNextBtn" title="Next" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  `;
  document.getElementById("leaderboardArea").innerHTML = buildLeaderboardHtml(insights);

  const CATS = ["#0B6E64", "#2F6FED", "#D55E00", "#7C4FC2", "#B07F12", "#B5568C"];

  function mrBars(rows, emptyMsg) {
    if (!rows.length) return `<p class="lb-empty" style="padding:0;">${emptyMsg}</p>`;
    const max = Math.max(...rows.map(r => r.v));
    return rows.map((r, i) => `
      <div class="mr-bar-row">
        <span class="mr-bar-label" title="${r.k}">${r.k}</span>
        <div class="mr-bar-track"><div class="mr-bar-fill" style="width:${(r.v / max * 100).toFixed(0)}%;background:${r.c || CATS[i % CATS.length]}"></div></div>
        <span class="mr-bar-val">${r.v}</span>
      </div>`).join("");
  }

  function mrDonut(rows) {
    const total = rows.reduce((a, r) => a + r.v, 0);
    if (!total) return { svg: "", legend: `<p class="lb-empty" style="padding:0;">No data this month</p>` };
    const cx = 60, cy = 60, rOuter = 52, rInner = 30;
    let angle = -90, paths = "";
    rows.forEach(r => {
      if (!r.v) return;
      const frac = r.v / total, start = angle, end = angle + frac * 360;
      angle = end;
      const toRad = a => (a * Math.PI) / 180;
      const x1 = cx + rOuter * Math.cos(toRad(start)), y1 = cy + rOuter * Math.sin(toRad(start));
      const x2 = cx + rOuter * Math.cos(toRad(end)), y2 = cy + rOuter * Math.sin(toRad(end));
      const x1i = cx + rInner * Math.cos(toRad(end)), y1i = cy + rInner * Math.sin(toRad(end));
      const x2i = cx + rInner * Math.cos(toRad(start)), y2i = cy + rInner * Math.sin(toRad(start));
      const large = end - start > 180 ? 1 : 0;
      paths += `<path d="M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x1i} ${y1i} A ${rInner} ${rInner} 0 ${large} 0 ${x2i} ${y2i} Z" fill="${r.c}"></path>`;
    });
    const legend = rows.map(r =>
      `<div class="mr-legend-row"><span class="mr-legend-swatch" style="background:${r.c}"></span><span class="mr-legend-name">${r.k}</span><span class="mr-legend-val">${r.v}</span></div>`
    ).join("");
    return { svg: paths, legend };
  }

  let mrMonth = currentMonthKey();

  function renderMonthlyReport() {
    document.getElementById("mrMonthLabel").textContent = monthLabel(mrMonth);
    const r = buildDeptMonthlyReport(insights, mrMonth);

    // Raw SVG fill attributes can't read CSS custom properties reliably,
    // so resolve the app's own on-call/turnover tokens to concrete
    // colors once here rather than hardcoding a second copy of them.
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const oncallColor = cssVar("--status-oncall"), turnoverColor = cssVar("--status-turnover");

    const theatreRows = Object.entries(r.theatreCounts).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ k, v }));
    const mixRows = [
      { k: "Sessions", v: r.mix.sessions, c: "#0B6E64" },
      { k: "On call", v: r.mix.onCall, c: oncallColor },
      { k: "Support", v: r.mix.support, c: turnoverColor },
      { k: "Coordinated", v: r.mix.coordinated, c: "#2F6FED" }
    ];
    const oncallRows = Object.entries(r.sodpOnCall).sort((a, b) => b[1] - a[1]).slice(0, 8)
      .map(([k, v]) => ({ k, v, c: oncallColor }));

    const donut = mrDonut(mixRows);

    document.getElementById("mrBody").innerHTML = `
      <div class="mr-card">
        <h4>Theatre sessions this month</h4>
        <div class="mr-sub">Department-wide — every SODP/anaesthetist session, by theatre</div>
        ${mrBars(theatreRows, "No sessions recorded this month")}
      </div>
      <div class="mr-card">
        <h4>Activity mix</h4>
        <div class="mr-sub">All rota assignments this month, by kind</div>
        <div class="mr-donut-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">${donut.svg}</svg>
          <div class="mr-legend">${donut.legend}</div>
        </div>
      </div>
      <div class="mr-card" style="grid-column:1 / -1;">
        <h4>SODP on-call shifts this month</h4>
        <div class="mr-sub">Everyone with at least one SODP on-call shift this month — a skewed chart is worth a look</div>
        ${mrBars(oncallRows, "No SODP on-call shifts recorded this month")}
      </div>
    `;
  }
  document.getElementById("mrPrev").addEventListener("click", () => { mrMonth = shiftMonthKey(mrMonth, -1); renderMonthlyReport(); });
  document.getElementById("mrNext").addEventListener("click", () => { mrMonth = shiftMonthKey(mrMonth, 1); renderMonthlyReport(); });
  renderMonthlyReport();

  // ---- Play Highlights slideshow --------------------------------------
  // Always built from the ACTUAL current month, independent of whatever
  // month the Monthly Reports panel above happens to be scrolled to —
  // this is a "what's happening right now" showcase, not tied to that
  // panel's own navigation state.
  const HL_ICONS = {
    theatre: `<path d="M4 4h16v13H4z"/><path d="M9 21h6M12 17v4"/>`,
    trophy: `<path d="M8 4h8v5a4 4 0 01-8 0V4z"/><path d="M8 5H5a3 3 0 003 3M16 5h3a3 3 0 01-3 3"/><path d="M12 13v3"/>`,
    badge: `<circle cx="12" cy="9" r="6"/><path d="M9 14.5L7 22l5-3 5 3-2-7.5"/>`,
    chart: `<path d="M4 20V10M12 20V4M20 20v-7"/>`
  };
  const HL_COLORS = [["#0B6E64", "#0E8F72"], ["#0B6E64", "#08514D"], ["#2F6FED", "#1E4FB8"], ["#7C4FC2", "#5B2FA0"], ["#B07F12", "#8A6209"]];
  const hlIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${HL_ICONS[k] || HL_ICONS.chart}</svg>`;
  function hlShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function hlInitials(name) { return name.split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase(); }

  // Pulls as much genuinely-distinct content as the department's own
  // history actually supports, rather than a fixed handful — every
  // published week adds more, so this naturally grows over time instead
  // of replaying the same ~10 slides on every watch.
  async function buildHighlightSlides() {
    const slides = [];
    const nowKey = currentMonthKey();
    const r = buildDeptMonthlyReport(insights, nowKey);

    if (r.mix.sessions > 0) {
      slides.push({ icon: "chart", kicker: "This month", headline: `<span class="num">${r.mix.sessions}</span>theatre sessions recorded department-wide` });
    }
    const theatreEntries = Object.entries(r.theatreCounts).sort((a, b) => b[1] - a[1]);
    if (theatreEntries.length) {
      const [name, count] = theatreEntries[0];
      slides.push({ icon: "theatre", kicker: "Busiest theatre this month", headline: `${name} has been the busiest theatre this month`, sub: `${count} session${count === 1 ? "" : "s"} — more than any other theatre` });
    }
    if (theatreEntries.length > 1) {
      const [name, count] = theatreEntries[theatreEntries.length - 1];
      slides.push({ icon: "theatre", kicker: "Quietest theatre this month", headline: `${name} has had the fewest sessions this month`, sub: `Just ${count} session${count === 1 ? "" : "s"} so far` });
    }
    const onCallEntries = Object.entries(r.sodpOnCall).sort((a, b) => b[1] - a[1]);
    if (onCallEntries.length) {
      const [name, count] = onCallEntries[0];
      slides.push({ icon: "trophy", kicker: "Leaderboard — SODP on call", headline: "Most SODP on-call shifts this month", person: name, personSub: `${count} shift${count === 1 ? "" : "s"}` });
    }

    // All-time standings — every group/category the Leaderboard itself
    // shows, one slide per category, not just the SODP-on-call slice
    // above (which is deliberately scoped to this month only).
    buildLeaderboardRankings(insights).forEach(group => {
      group.categories.forEach(cat => {
        if (!cat.ranked.length) return;
        slides.push({
          icon: "trophy", kicker: `Leaderboard — ${group.label} · ${cat.label}`,
          headline: `Top ${Math.min(3, cat.ranked.length)} of all time`,
          list: cat.ranked.slice(0, 3)
        });
      });
    });

    // Theatre Intelligence's full fact pool (not just a handful) — the
    // same shuffle-and-pick Theatre Intelligence's own "Shuffle" button
    // uses, just requesting far more of the pool than the small card on
    // the Dashboard has room for.
    const todayIsoNow = new Date().toISOString().split("T")[0];
    const [odpTI, nurTI] = await Promise.all([
      loadTheatreIntelligence(profile.departmentId, insights.theatres, mondayOfCurrentWeek(), todayIsoNow),
      loadNursingTheatreIntelligence(profile.departmentId, insights.theatres, mondayOfCurrentWeek(), todayIsoNow)
    ]);
    if (odpTI.hasData) odpTI.pickFacts(20).forEach(f => slides.push({ icon: "chart", kicker: "Did you know — SODP", headline: f }));
    if (nurTI.hasData) nurTI.pickFacts(20).forEach(f => slides.push({ icon: "chart", kicker: "Did you know — Nursing", headline: f }));

    // Every badge anyone currently holds, not a fixed handful — each
    // person contributes at most one (picked at random when they hold
    // several) so one prolific SODP can't fill the whole reel.
    pickBadgeHighlights(insights, insights.staffList.length).forEach(b => {
      slides.push({ icon: "badge", kicker: "Badge", headline: b.badge, person: b.name });
    });

    return hlShuffle(slides);
  }

  const hlOverlay = document.getElementById("hlOverlay");
  let hlSlides = [], hlCur = 0, hlPlaying = true, hlTimer = null;
  const HL_DURATION = 5000;

  function hlSlideHtml(s, i) {
    const [c1, c2] = HL_COLORS[i % HL_COLORS.length];
    const personHtml = s.person
      ? `<div class="hl-person"><span class="hl-avatar">${hlInitials(s.person)}</span><span>${s.person}${s.personSub ? ` — ${s.personSub}` : ""}</span></div>`
      : "";
    const listHtml = s.list
      ? `<div class="hl-list">${s.list.map((p, r) => `
          <div class="hl-list-row"><span class="hl-rank">${r + 1}</span><span class="hl-list-name">${p.name}</span><span class="hl-list-val">${p.value}</span></div>
        `).join("")}</div>`
      : "";
    return `<div class="hl-slide" id="hlSlide-${i}" style="--sc1:${c1};--sc2:${c2};">
      <div class="hl-kicker">${hlIcon(s.icon)}${s.kicker}</div>
      <div class="hl-headline">${s.headline}</div>
      ${s.sub ? `<div class="hl-sub">${s.sub}</div>` : ""}
      ${personHtml}
      ${listHtml}
    </div>`;
  }

  function hlRender() {
    hlSlides.forEach((_, i) => document.getElementById(`hlSlide-${i}`).classList.toggle("active", i === hlCur));
    hlSlides.forEach((_, i) => {
      const seg = document.getElementById(`hlSeg-${i}`);
      seg.classList.toggle("done", i < hlCur);
      const fill = seg.querySelector(".fill");
      if (i === hlCur && hlPlaying) { fill.style.animation = "none"; void fill.offsetWidth; fill.style.animation = `hlFillbar ${HL_DURATION}ms linear forwards`; }
      else if (i !== hlCur) { fill.style.animation = "none"; }
    });
  }
  function hlGoTo(i) { hlCur = (i + hlSlides.length) % hlSlides.length; hlRender(); hlRestart(); }
  function hlNext() { hlGoTo(hlCur + 1); }
  function hlPrev() { hlGoTo(hlCur - 1); }
  function hlRestart() { clearTimeout(hlTimer); if (hlPlaying) hlTimer = setTimeout(hlNext, HL_DURATION); }

  async function hlOpen() {
    hlOverlay.hidden = false;
    document.getElementById("hlSlides").innerHTML = `<div class="hl-slide active" style="--sc1:#0B6E64;--sc2:#08514D;"><div class="hl-empty">Loading…</div></div>`;
    hlSlides = await buildHighlightSlides();
    if (!hlSlides.length) {
      document.getElementById("hlSlides").innerHTML = `<div class="hl-slide active" style="--sc1:#0B6E64;--sc2:#08514D;"><div class="hl-empty">Not enough published rota history yet for highlights — check back once a few weeks are published.</div></div>`;
      document.getElementById("hlProgressRow").innerHTML = "";
      return;
    }
    document.getElementById("hlSlides").innerHTML = hlSlides.map(hlSlideHtml).join("");
    document.getElementById("hlProgressRow").innerHTML = hlSlides.map((_, i) => `<div class="hl-progress-seg" id="hlSeg-${i}"><div class="fill"></div></div>`).join("");
    hlCur = 0; hlPlaying = true;
    document.getElementById("hlPlayBtn").innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`;
    hlRender();
    hlRestart();
  }
  function hlClose() {
    hlOverlay.hidden = true;
    clearTimeout(hlTimer);
  }

  document.getElementById("hlLaunchBtn").addEventListener("click", hlOpen);
  document.getElementById("hlExitBtn").addEventListener("click", hlClose);
  document.getElementById("hlNextBtn").addEventListener("click", hlNext);
  document.getElementById("hlPrevBtn").addEventListener("click", hlPrev);
  document.getElementById("hlPlayBtn").addEventListener("click", (e) => {
    hlPlaying = !hlPlaying;
    e.currentTarget.innerHTML = hlPlaying
      ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>`;
    hlRender();
    hlRestart();
  });
  document.addEventListener("keydown", (e) => {
    if (hlOverlay.hidden) return;
    if (e.key === "Escape") hlClose();
    else if (e.key === "ArrowRight") hlNext();
    else if (e.key === "ArrowLeft") hlPrev();
  });
</script>
</body>
</html>
