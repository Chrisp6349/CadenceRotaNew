<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Staff Profiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .sp-picker{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
  .sp-picker select{font-family:var(--font-body);font-size:13.5px;padding:9px 12px;border-radius:var(--r-sm);
    border:1px solid var(--ink-150);background:var(--surface);color:var(--ink-900);min-width:240px;}
  .empty-note{color:var(--ink-500);font-size:13.5px;padding:20px 0;}

  .sp-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .sp-avatar{width:48px;height:48px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:16px;flex-shrink:0;}
  .sp-name{font-family:var(--font-display);font-weight:800;font-size:20px;}
  .sp-role{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;}

  .sp-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}

  .sp-section-title{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.05em;margin:24px 0 10px;}

  .sp-bar-chart{display:flex;align-items:flex-end;gap:4px;}
  .sp-bar-col{flex:1;max-width:64px;display:flex;flex-direction:column;align-items:center;border-radius:4px;}
  .sp-bar-value{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);height:14px;opacity:0;
    transition:opacity .15s;}
  .sp-bar-col.always-label .sp-bar-value,.sp-bar-col:hover .sp-bar-value,.sp-bar-col:focus-visible .sp-bar-value{opacity:1;}
  .sp-bar-area{height:72px;width:100%;max-width:24px;display:flex;align-items:flex-end;}
  .sp-bar{width:100%;background:var(--teal-600);border-radius:4px 4px 0 0;min-height:2px;transition:opacity .15s;}
  .sp-bar.zero{background:var(--ink-150);}
  .sp-bar-col:hover .sp-bar,.sp-bar-col:focus-visible .sp-bar{opacity:.75;}
  .sp-bar-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);text-transform:uppercase;margin-top:6px;
    white-space:nowrap;}
  .sp-bar-col:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px;}

  .sp-badges{display:flex;flex-wrap:wrap;gap:8px;}
  .sp-badge{background:var(--teal-100);color:var(--teal-700);font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:var(--r-pill);}
</style>
</head>
<body>
<div id="shellRoot"></div>

<script type="module">
   import { requireSession, blockBoardOnly } from "./js/auth.js";

  import { renderShell } from "./js/shell.js";
  import { getDepartment, listTheatres, listStaff } from "./js/department.js";
  import { mondayOfCurrentWeek } from "./js/rota.js";
  import { loadEligibleEntries as loadOdpEntries, classify as classifyOdp, buildSessionGroups as buildOdpSessionGroups } from "./js/insights.js";
  import { loadEligibleEntries as loadNursingEntries, classify as classifyNursing, buildSessionGroups as buildNursingSessionGroups } from "./js/nursing-insights.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

   const { user, profile } = await requireSession();
  await blockBoardOnly(profile);
  // Fired together, not one-after-another — see rota.html for the same
  // pattern and why.
  const deptPromise = getDepartment(profile.departmentId);
  const theatresPromise = listTheatres(profile.departmentId);
  const staffListPromise = listStaff(profile.departmentId);

  const dept = await deptPromise;
  profile.departmentName = dept?.name || "Department";

  const content = renderShell({ profile, activePage: "staff", title: "Staff Profiles" });

  const theatres = await theatresPromise;
  const staffList = await staffListPromise;

  // Every role in the department now shows up here — ODPs and
  // anaesthetists pull their history from the ODP rota, everyone else
  // (nurses, HCAs, surgeons) from the nursing rota. Display name follows
  // the same convention department.js's splitStaff() uses when building
  // the rota's own dropdowns, since that's what's actually stored in the
  // rota data this page matches names against: rotaName-or-name for
  // ODPs/nurses/HCAs, always the full name for anaesthetists/surgeons.
  const TYPE_LABELS = {
    odp: "SODP", anaesthetist: "Anaesthetist",
    nurse: "Nurse", nurse_band5: "Band 5 Nurse", nurse_band6: "Band 6 Nurse", nurse_aptap: "AP/TAP",
    hca: "HCA", surgeon: "Surgeon"
  };
  const NURSE_LIKE_TYPES = ["nurse", "nurse_band5", "nurse_band6", "nurse_aptap"];
  const NURSING_TYPES = [...NURSE_LIKE_TYPES, "hca", "surgeon"];
  function isNursingType(type) { return NURSING_TYPES.includes(type); }
  function shownName(s) { return (s.type === "anaesthetist" || s.type === "surgeon") ? s.name : (s.rotaName || s.name); }

  function localIso(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  const todayIso = localIso(new Date());

  content.innerHTML = `
    <div class="sp-picker">
      <select id="staffSelect">
        <option value="">Select someone…</option>
               ${[...staffList].sort((a, b) => a.name.localeCompare(b.name)).map(s => {
          const shown = shownName(s);
          const label = shown === s.name ? `${shown} (${TYPE_LABELS[s.type] || s.type})` : `${shown} — ${s.name} (${TYPE_LABELS[s.type] || s.type})`;
          return `<option value="${shown}" data-type="${s.type}">${label}</option>`;
        }).join("")}
      </select>
    </div>
    <div id="profileArea">${emptyStateHtml("staff", "Pick a name to see their history", "Choose anyone above — sessions, on-call, and their favourite theatre all pull from the published rota.")}</div>
  `;

  function emptyStateHtml(icon, title, sub) {
    const icons = {
      staff: `<circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>`,
      chart: `<path d="M4 20V10M12 20V4M20 20v-7"/>`
    };
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icons[icon]}</svg>
      <div class="es-title">${title}</div>
      <div class="es-sub">${sub}</div>
    </div>`;
  }

  // Fetch and flatten both published histories once, in parallel — every
  // profile lookup after that is instant, no further Firestore reads.
  const [odpResult, nursingResult] = await Promise.all([
    loadOdpEntries(profile.departmentId, theatres, mondayOfCurrentWeek(), todayIso),
    loadNursingEntries(profile.departmentId, theatres, mondayOfCurrentWeek(), todayIso)
  ]);
  const odpEntries = odpResult.entries;
  const odpSessionGroups = buildOdpSessionGroups(odpEntries, theatres);
  const nurEntries = nursingResult.entries;
  const nurSessionGroups = buildNursingSessionGroups(nurEntries, theatres);

  // The full set of published weeks (across everyone, not just one
  // person) — this is the trend chart's x-axis, so a week where someone
  // did zero sessions still shows up as a real zero bar rather than a
  // gap, instead of only ever listing weeks that person actually worked.
  const ALL_ODP_WEEKS = [...new Set(odpSessionGroups.map(g => g.weekStart))].sort();
  const ALL_NUR_WEEKS = [...new Set(nurSessionGroups.map(g => g.weekStart))].sort();

  function initials(name) {
    return name.split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase();
  }

  function buildWeeklyTrend(mySessions, allWeeks) {
    const counts = {};
    mySessions.forEach(g => { counts[g.weekStart] = (counts[g.weekStart] || 0) + 1; });
    return allWeeks.slice(-8).map(w => ({ weekStart: w, count: counts[w] || 0 }));
  }

  function weekShortLabel(iso) {
    return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  // Shared renderer for both the weekly-trend and day-of-week charts —
  // same bar anatomy either way. items: [{label, value, title}]. The
  // single tallest bar keeps a permanent value label (the one the story
  // is about); the rest reveal their value on hover/focus so the chart
  // doesn't drown in numbers.
  function barChartHtml(items) {
    const max = Math.max(1, ...items.map(i => i.value));
    return `<div class="sp-bar-chart">
      ${items.map(i => {
        const pct = i.value === 0 ? 0 : Math.max(6, Math.round((i.value / max) * 100));
        return `<div class="sp-bar-col${i.value === max && i.value > 0 ? " always-label" : ""}" tabindex="0" title="${i.title}">
          <div class="sp-bar-value">${i.value}</div>
          <div class="sp-bar-area"><div class="sp-bar${i.value === 0 ? " zero" : ""}" style="height:${i.value === 0 ? 2 : pct}%"></div></div>
          <div class="sp-bar-label">${i.label}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function buildOdpProfile(name) {
    const mySessions = odpSessionGroups.filter(g => g.odps.includes(name) || g.anaes === name);
    const theatreCounts = {};
    const dayCounts = {};
    const partnerCounts = {};

    mySessions.forEach(g => {
      theatreCounts[g.theatreName] = (theatreCounts[g.theatreName] || 0) + 1;
      dayCounts[g.day] = (dayCounts[g.day] || 0) + 1;
      if (g.anaes === name) {
        g.odps.forEach(odp => { partnerCounts[odp] = (partnerCounts[odp] || 0) + 1; });
      } else if (g.anaes) {
        partnerCounts[g.anaes] = (partnerCounts[g.anaes] || 0) + 1;
      }
    });

    let onCallCount = 0, supportCount = 0;
    odpEntries.forEach(({ suffix, value }) => {
      if (value !== name) return;
      const c = classifyOdp(suffix, theatres);
      if (c?.kind === "oncall_odp" || c?.kind === "oncall_anaes") onCallCount++;
      else if (c?.kind === "support") supportCount++;
    });

    const favouriteTheatre = Object.entries(theatreCounts).sort((a, b) => b[1] - a[1])[0] || null;
    const topPartner = Object.entries(partnerCounts).sort((a, b) => b[1] - a[1])[0] || null;

    const badges = [];
    if (mySessions.length >= 20) badges.push("Regular — 20+ sessions");
    if (onCallCount >= 10) badges.push("On-call veteran — 10+ shifts");
    if (Object.keys(partnerCounts).length >= 5) badges.push("Team player — worked with 5+ colleagues");
    if (favouriteTheatre && favouriteTheatre[1] >= 10) badges.push(`${favouriteTheatre[0]} regular`);

    return { sessionsWorked: mySessions.length, theatreCounts, dayCounts, onCallCount, supportCount, coordinatorCount: 0, favouriteTheatre, topPartner, badges, weeklyTrend: buildWeeklyTrend(mySessions, ALL_ODP_WEEKS) };
  }

  // Nursing sessions don't pair an ODP with an anaesthetist — they pair a
  // surgeon with that session's nurses. "Most frequent colleague" for a
  // surgeon is their most-worked-with nurse; for a nurse/HCA, it's their
  // most-worked-with surgeon.
  function buildNursingProfile(name) {
    const mySessions = nurSessionGroups.filter(g => g.nurses.includes(name) || g.hcas.includes(name) || g.surgeons.includes(name));
    const theatreCounts = {};
    const dayCounts = {};
    const partnerCounts = {};

    mySessions.forEach(g => {
      theatreCounts[g.theatreName] = (theatreCounts[g.theatreName] || 0) + 1;
      dayCounts[g.day] = (dayCounts[g.day] || 0) + 1;
      if (g.surgeons.includes(name)) {
        if (g.nurses[0]) partnerCounts[g.nurses[0]] = (partnerCounts[g.nurses[0]] || 0) + 1;
      } else {
        g.surgeons.forEach(s => { partnerCounts[s] = (partnerCounts[s] || 0) + 1; });
      }
    });

    let onCallCount = 0, supportCount = 0, coordinatorCount = 0;
    nurEntries.forEach(({ suffix, value }) => {
      if (value !== name) return;
      const c = classifyNursing(suffix, theatres);
      if (!c) return;
      if (c.kind.startsWith("oncall_")) onCallCount++;
      else if (c.kind.startsWith("support_")) supportCount++;
      else if (c.kind === "coordinator") coordinatorCount++;
    });

    const favouriteTheatre = Object.entries(theatreCounts).sort((a, b) => b[1] - a[1])[0] || null;
    const topPartner = Object.entries(partnerCounts).sort((a, b) => b[1] - a[1])[0] || null;

    const badges = [];
    if (mySessions.length >= 20) badges.push("Regular — 20+ sessions");
    if (onCallCount >= 10) badges.push("On-call veteran — 10+ shifts");
    if (coordinatorCount >= 10) badges.push("Coordination veteran — 10+ shifts");
    if (Object.keys(partnerCounts).length >= 5) badges.push("Team player — worked with 5+ colleagues");
    if (favouriteTheatre && favouriteTheatre[1] >= 10) badges.push(`${favouriteTheatre[0]} regular`);

    return { sessionsWorked: mySessions.length, theatreCounts, dayCounts, onCallCount, supportCount, coordinatorCount, favouriteTheatre, topPartner, badges, weeklyTrend: buildWeeklyTrend(mySessions, ALL_NUR_WEEKS) };
  }

  function buildProfile(name, type) {
    const stats = isNursingType(type) ? buildNursingProfile(name) : buildOdpProfile(name);
    return { type, ...stats };
  }

  function render(name, type) {
    const el = document.getElementById("profileArea");
    if (!name) {
      el.innerHTML = emptyStateHtml("staff", "Pick a name to see their history", "Choose anyone above — sessions, on-call, and their favourite theatre all pull from the published rota.");
      return;
    }
    const p = buildProfile(name, type);
    const ALL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const roleLabel = TYPE_LABELS[type] || type;
    // Anaesthetists and surgeons never fill a Support slot; only
    // nurse-banded staff (not HCAs) ever get picked as Coordinator —
    // matches the rota fields each role can actually appear in.
    const showSupport = type !== "anaesthetist" && type !== "surgeon";
    const showCoordinator = NURSE_LIKE_TYPES.includes(type);

    if (p.sessionsWorked === 0 && p.onCallCount === 0 && p.supportCount === 0 && p.coordinatorCount === 0) {
      el.innerHTML = `
        <div class="sp-head">
          <div class="sp-avatar">${initials(name)}</div>
          <div><div class="sp-name">${name}</div><div class="sp-role">${roleLabel}</div></div>
        </div>
        ${emptyStateHtml("chart", "No published history yet", `Once a week including ${name} is published, their sessions and stats will show up here.`)}`;
      return;
    }

    const patternHtml = barChartHtml(ALL_DAYS.map(d => ({
      label: d.slice(0, 3),
      value: p.dayCounts[d] || 0,
      title: `${d}: ${p.dayCounts[d] || 0} session${(p.dayCounts[d] || 0) === 1 ? "" : "s"}`
    })));

    // A trend needs at least a couple of distinct weeks to say anything —
    // one bar is just the stat tile above repeated as a chart, so skip
    // the section entirely rather than show something meaningless.
    const trendHtml = p.weeklyTrend.length > 1 ? `
      <div class="sp-section-title">Sessions per week</div>
      ${barChartHtml(p.weeklyTrend.map(w => ({
        label: weekShortLabel(w.weekStart),
        value: w.count,
        title: `Week of ${weekShortLabel(w.weekStart)}: ${w.count} session${w.count === 1 ? "" : "s"}`
      })))}
    ` : "";

    el.innerHTML = `
      <div class="sp-head">
        <div class="sp-avatar">${initials(name)}</div>
        <div><div class="sp-name">${name}</div><div class="sp-role">${roleLabel}</div></div>
      </div>
      <div class="sp-stat-grid">
        <div class="card"><div class="card-label">Theatre sessions</div><div class="card-value">${p.sessionsWorked}</div></div>
        <div class="card"><div class="card-label">On call</div><div class="card-value">${p.onCallCount}</div></div>
        ${showSupport ? `<div class="card"><div class="card-label">Support duty</div><div class="card-value">${p.supportCount}</div></div>` : ""}
        ${showCoordinator ? `<div class="card"><div class="card-label">Coordinated</div><div class="card-value">${p.coordinatorCount}</div></div>` : ""}
        <div class="card"><div class="card-label">Favourite theatre</div><div class="card-value" style="font-size:18px;">${p.favouriteTheatre ? p.favouriteTheatre[0] : "—"}</div></div>
      </div>
      ${trendHtml}
      <div class="sp-section-title">Work pattern by day</div>
      ${patternHtml}

      <div class="sp-section-title">Most frequent colleague</div>
      <p style="font-size:13.5px;color:var(--ink-700);">${p.topPartner ? `${p.topPartner[0]} — worked together ${p.topPartner[1]} time${p.topPartner[1] === 1 ? "" : "s"}` : "Not enough data yet"}</p>

      ${p.badges.length ? `
        <div class="sp-section-title">Badges</div>
        <div class="sp-badges">${p.badges.map(b => `<span class="sp-badge">${b}</span>`).join("")}</div>
      ` : ""}
    `;
  }

  document.getElementById("staffSelect").addEventListener("change", (e) => {
    const opt = e.target.selectedOptions[0];
    render(e.target.value, opt?.dataset.type);
  });
</script>
</body>
</html>
