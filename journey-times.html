<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Journey Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .jt-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .jt-toolbar input[type=date]{font-family:var(--font-body);padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--ink-150);}
  .jt-toolbar .spacer{flex:1;}

  .jt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:760px){.jt-stats{grid-template-columns:1fr;}}
  .jt-stat-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);padding:16px 18px;
    box-shadow:var(--shadow-sm);border-left:3px solid var(--teal-600);}
  .jt-stat-card .st-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-300);margin-bottom:8px;}
  .jt-stat-card .st-value{font-family:var(--font-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:6px;}
  .jt-stat-card .st-value .unit{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-500);}
  .jt-stat-card .st-sub{font-size:12px;color:var(--ink-500);margin-top:6px;font-variant-numeric:tabular-nums;}
  .jt-stat-card .st-flag{margin-top:9px;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);
    font-size:10.5px;color:var(--status-oncall);background:var(--status-oncall-bg);border-radius:999px;padding:3px 9px;}

  .jt-lb-section{margin-bottom:18px;}
  .jt-lb-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-500);margin-bottom:10px;}
  .jt-lb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:760px){.jt-lb-grid{grid-template-columns:1fr;}}
  .lb-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);padding:14px 16px;
    box-shadow:var(--shadow-sm);}
  .lb-cat{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-900);margin-bottom:10px;}
  .lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .lb-row{display:flex;align-items:center;gap:10px;}
  .lb-rank{font-family:var(--font-mono);font-weight:700;font-size:11px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-100);color:var(--ink-500);}
  .lb-row:first-child .lb-rank{background:var(--teal-100);color:var(--teal-700);}
  .lb-card.slow .lb-row:first-child .lb-rank{background:var(--status-oncall-bg);color:var(--status-oncall);}
  .lb-card.slow .lb-value{color:var(--status-oncall);}
  .lb-name{font-size:12.5px;font-weight:600;color:var(--ink-900);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-sub{display:block;font-size:10.5px;font-weight:400;color:var(--ink-500);}
  .lb-value{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--teal-700);flex-shrink:0;
    font-variant-numeric:tabular-nums;}
  .lb-empty{color:var(--ink-300);font-size:12px;font-style:italic;}

  .jt-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--ink-150);
    border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
  .jt-controls .grp-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-300);margin-right:2px;}
  .jt-chip{font-family:var(--font-body);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;
    border:1px solid var(--ink-150);background:var(--canvas);color:var(--ink-500);cursor:pointer;user-select:none;}
  .jt-chip.on{background:var(--teal-600);border-color:var(--teal-600);color:#fff;}
  .jt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-500);cursor:pointer;user-select:none;}

  .jt-table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);}
  table.jt-table{border-collapse:collapse;width:100%;min-width:920px;font-size:12.5px;}
  table.jt-table thead th{position:sticky;top:0;background:var(--teal-50);font-family:var(--font-mono);font-size:10px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);text-align:left;padding:9px 10px;
    border-bottom:1px solid var(--ink-150);white-space:nowrap;cursor:pointer;}
  table.jt-table thead th:hover{color:var(--teal-700);}
  table.jt-table thead th .arrow{opacity:.4;font-size:9px;margin-left:3px;}
  table.jt-table thead th.sorted .arrow{opacity:1;color:var(--teal-600);}
  table.jt-table tbody td{padding:7px 10px;border-bottom:1px solid var(--ink-100);vertical-align:middle;}
  table.jt-table tbody tr:hover td{background:var(--ink-100);}
  table.jt-table tbody tr.is-cancelled td{color:var(--ink-300);}
  table.jt-table tbody tr.is-cancelled .dur-cell{opacity:.55;}
  table.jt-table td.daycell{font-weight:600;white-space:nowrap;}
  table.jt-table td.reason-cell{max-width:260px;font-size:11.5px;color:var(--ink-500);
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
  .jt-cancelled-badge{display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--status-closed);
    background:var(--status-closed-bg);padding:2px 7px;border-radius:4px;}

  .dur-cell{display:flex;align-items:center;gap:7px;min-width:120px;}
  .dur-bar-track{flex:1;height:7px;border-radius:4px;background:var(--ink-100);overflow:hidden;}
  .dur-bar-fill{height:100%;border-radius:4px;background:var(--status-inlist);}
  .dur-bar-fill.high{background:var(--status-turnover);}
  .dur-num{font-family:var(--font-mono);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
    width:38px;text-align:right;flex-shrink:0;}
  .dur-num.high{color:var(--status-turnover);}
  .dur-missing{color:var(--ink-300);font-size:12px;}
  .dur-anomaly{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;
    color:var(--status-oncall);background:var(--status-oncall-bg);border-radius:4px;padding:2px 6px;cursor:help;}

  .jt-foot-note{font-size:12px;color:var(--ink-500);line-height:1.6;background:var(--teal-50);border:1px solid var(--teal-100);
    border-radius:var(--r-md);padding:12px 14px;margin-top:18px;}
  .jt-foot-note b{color:var(--ink-900);}

  .jt-reasons{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);margin-bottom:18px;overflow:hidden;}
  .jt-reasons-head{padding:14px 18px;border-bottom:1px solid var(--ink-150);}
  .jt-reasons-head-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .jt-reasons-head h3{font-family:var(--font-display);font-weight:800;font-size:14px;margin:0 0 2px;}
  .jt-reasons-head .jt-reasons-sub{font-size:12px;color:var(--ink-500);}
  .jt-reasons-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .jt-reason-row{display:flex;align-items:flex-start;gap:12px;}
  .jt-reason-rank{font-family:var(--font-mono);font-weight:700;font-size:12px;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-100);color:var(--ink-500);
    margin-top:2px;}
  .jt-reason-row:first-child .jt-reason-rank{background:var(--status-oncall-bg);color:var(--status-oncall);}
  .jt-reason-main{flex:1;min-width:0;}
  .jt-reason-top{display:flex;align-items:center;gap:10px;}
  .jt-reason-label{font-weight:700;font-size:13.5px;color:var(--ink-900);}
  .jt-reason-bar-track{flex:1;height:8px;background:var(--ink-100);border-radius:4px;overflow:hidden;}
  .jt-reason-bar-fill{height:100%;border-radius:4px;background:var(--status-oncall);}
  .jt-reason-count{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--ink-700);flex-shrink:0;
    width:20px;text-align:right;}
  .jt-reason-examples{font-size:11.5px;color:var(--ink-500);margin-top:4px;font-style:italic;}

  .jt-trend{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);margin-bottom:18px;padding:16px 18px;}
  .jt-trend-head h3{font-family:var(--font-display);font-weight:800;font-size:14px;margin:0 0 2px;}
  .jt-trend-sub{font-size:12px;color:var(--ink-500);margin-bottom:12px;}
  .jt-trend-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
  .jt-trend-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-700);}
  .jt-trend-swatch{width:14px;height:2px;border-radius:1px;flex-shrink:0;}
  .jt-trend-charts{position:relative;}
  .jt-trend-charts svg{display:block;width:100%;}
  .jt-trend-chart-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-300);margin:12px 0 2px;}
  .jt-trend-gridline{stroke:var(--ink-100);stroke-width:1;}
  .jt-trend-axislabel{fill:var(--ink-300);font-size:9.5px;font-family:'IBM Plex Mono',monospace;}
  .jt-trend-endlabel{fill:var(--ink-700);font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .jt-trend-crosshair{stroke:var(--ink-300);stroke-width:1;pointer-events:none;opacity:0;}
  .jt-trend-barlabel{fill:var(--ink-500);font-size:9.5px;font-family:'IBM Plex Mono',monospace;}
  .jt-trend-tooltip{position:absolute;pointer-events:none;background:var(--ink-900);color:#fff;font-size:12px;
    line-height:1.5;border-radius:8px;padding:8px 11px;box-shadow:var(--shadow-md);opacity:0;z-index:5;
    transform:translate(-50%,-100%);top:0;left:0;white-space:nowrap;transition:opacity .08s;}
  html[data-theme="dark"] .jt-trend-tooltip{background:var(--surface);border:1px solid var(--ink-150);color:var(--ink-900);}
  .jt-trend-tooltip .tt-week{font-weight:700;margin-bottom:4px;}
  .jt-trend-tooltip .tt-row{display:flex;align-items:center;gap:6px;}
  .jt-trend-tooltip .tt-key{width:9px;height:2px;border-radius:1px;flex-shrink:0;}
  .jt-trend-tooltip .tt-val{margin-left:auto;font-family:var(--font-mono);font-weight:700;padding-left:10px;}
  .jt-trend-empty{color:var(--ink-300);font-size:12.5px;font-style:italic;padding:8px 0;}

  /* Printing this page should only print the Cancellation reasons card
     — the week picker, stats, leaderboards and the whole case table
     are screen-only context, not what someone hitting Print wants on
     paper. Same black-on-white approach as rota.html's print block,
     for the same reason (dark theme's --ink tokens turn near-white,
     which is invisible on paper). */
  @media print{
    #shellRoot .app-sidebar,#shellRoot .app-topbar{display:none !important;}
    #shellRoot .app-main,#shellRoot .app-content{overflow:visible !important;height:auto !important;padding:0 !important;}
    .jt-toolbar,.jt-stats,.jt-lb-section,.jt-controls,.jt-table-wrap,.jt-foot-note,.jt-trend,.jt-no-print{display:none !important;}
    body,body *{color:#000 !important;background:#fff !important;}
    .jt-reasons{border:none !important;box-shadow:none !important;}
    .jt-reason-bar-fill{background:#000 !important;}
    .jt-reason-rank{background:#e0e0e0 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div id="shellRoot"></div>

<script type="module">
  import { requireSession, blockBoardOnly } from "./js/auth.js";
  import { renderShell } from "./js/shell.js";
  import { loadJourneyWeek, loadJourneyTrend, buildCancellationReasonStats } from "./js/journey-times.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

  const { user, profile } = await requireSession();
  await blockBoardOnly(profile);

  const content = renderShell({ profile, activePage: "journeyTimes", title: "Journey Times" });

  // Restricted to specific named people (see js/users.js's
  // updateJourneyTimesAccess()) rather than by role — shell.js already
  // hides the nav link for anyone without access, but the link isn't
  // what keeps someone out; this check plus the matching Firestore rule
  // (firestore.rules' journeyTimes match) are what actually do, since a
  // direct URL visit skips the nav entirely.
  if (!(profile.role === "admin" || profile.canViewJourneyTimes === true)) {
    content.innerHTML = `<p style="color:var(--ink-500);">This report is only available to people who've been given access to it — ask your admin.</p>`;
  } else {
    await renderPage();
  }

  function mondayOf(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }
  function isoPlusDays(iso, n) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }
  // These reports are typically uploaded once a week's already finished
  // — defaulting to THIS week (like the rota does) would almost always
  // land on an empty page, so default one week back instead.
  function defaultWeekStart() {
    const d = new Date();
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day - 7);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function shortDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return `${d.getDate()} ${d.toLocaleDateString("en-GB", { month: "short" })}`;
  }

  function niceStep(max) {
    const steps = [5, 10, 15, 20, 25, 30, 45, 60, 90, 120, 180];
    return steps.find(s => max / s <= 4) || Math.ceil(max / 5 / 60) * 60;
  }

  // ---- Trend over time ---------------------------------------------
  // Deliberately NOT scoped to the week picker above — the whole point
  // is seeing several weeks side by side, so it loads every uploaded
  // week once, independent of whatever week the rest of the page is
  // showing. Capped to the most recent 26 (roughly six months) so the
  // chart doesn't get unreadably cramped as upload history grows.
  async function renderTrend() {
    const el = document.getElementById("jtTrend");
    // Same teal/blue/orange trio Monthly Reports already uses elsewhere
    // in the app, for one consistent palette across every chart in
    // Cadence. CANCEL_COLOR (red) lives in its own chart below with its
    // own title and axis — it's never a rival series next to these
    // three, so it doesn't need to be colour-distinct from the orange.
    const TREND_METRICS = [
      { key: "sent_arrived", label: "Sent → Arrived", color: "#0B6E64" },
      { key: "started_into", label: "Started → Into theatre", color: "#2F6FED" },
      { key: "into_knife", label: "Into theatre → Knife", color: "#D55E00" }
    ];
    const CANCEL_COLOR = "#E0554F";
    const TREND_MAX_WEEKS = 26;
    const uploaded = await loadJourneyTrend(profile.departmentId);
    if (uploaded.length < 2) {
      el.innerHTML = `
        <div class="jt-trend-head"><h3>Trend over time</h3></div>
        <div class="jt-trend-empty">Upload at least two weeks of journey times to see a trend here.</div>
      `;
      return;
    }
    // A week that was never uploaded at all shouldn't be silently
    // skipped — stitching straight from one upload to the next, with
    // even spacing between them, would smooth over a skipped week and
    // misreport it as a continuous trend. Rebuilding every Monday
    // between the first and last upload, with a null placeholder for
    // any that have no document, means a genuinely missing week shows
    // as the real gap it is — both in the spacing (that stretch of the
    // axis is wider) and as a visible break in the line.
    const byStart = Object.fromEntries(uploaded.map(w => [w.weekStart, w]));
    const full = [];
    for (let d = uploaded[0].weekStart; d <= uploaded[uploaded.length - 1].weekStart; d = isoPlusDays(d, 7)) {
      full.push(byStart[d] || { weekStart: d, week: null, summary: null, totals: null });
    }
    const weeks = full.slice(-TREND_MAX_WEEKS);

    const PAD_L = 38, PAD_R = 14, PAD_T = 12, PAD_B = 24;
    const W = 640, H1 = 190, H2 = 100;
    const plotW = W - PAD_L - PAD_R;
    const xAt = (i) => weeks.length === 1 ? PAD_L + plotW / 2 : PAD_L + (i / (weeks.length - 1)) * plotW;

    // ---- chart 1: the three duration metrics, one shared minutes axis
    const allMeans = weeks.flatMap(w => TREND_METRICS.map(m => w.summary?.[m.key]?.mean)).filter(v => v != null);
    const rawMax = allMeans.length ? Math.max(...allMeans) : 10;
    const step = niceStep(rawMax);
    const niceMax = step * Math.ceil(Math.max(rawMax, step) / step);
    const plotH1 = H1 - PAD_T - PAD_B;
    const y1At = (v) => PAD_T + (1 - v / niceMax) * plotH1;

    const gridTicks = [0, step, step * 2, step * 3, step * 4].filter(t => t <= niceMax);
    const gridlines1 = gridTicks.map(t => `
      <line class="jt-trend-gridline" x1="${PAD_L}" x2="${W - PAD_R}" y1="${y1At(t)}" y2="${y1At(t)}"/>
      <text class="jt-trend-axislabel" x="${PAD_L - 6}" y="${y1At(t) + 3}" text-anchor="end">${t}</text>
    `).join("");

    // The first/last labels anchor to start/end rather than centering,
    // so they align with the plot edge instead of overflowing it.
    const thin = Math.ceil(weeks.length / 8);
    const xAnchor = (i) => i === 0 ? "start" : i === weeks.length - 1 ? "end" : "middle";
    const xLabels1 = weeks.map((w, i) => (i % thin === 0 || i === weeks.length - 1)
      ? `<text class="jt-trend-axislabel" x="${xAt(i)}" y="${H1 - 6}" text-anchor="${xAnchor(i)}">${esc(shortDate(w.weekStart))}</text>` : "").join("");

    const lineLayers = TREND_METRICS.map(m => {
      let path = "", open = false;
      const points = [];
      weeks.forEach((w, i) => {
        const v = w.summary?.[m.key]?.mean;
        if (v == null) { open = false; return; }
        const x = xAt(i), y = y1At(v);
        path += (open ? " L " : " M ") + x.toFixed(1) + " " + y.toFixed(1);
        open = true;
        points.push({ x, y });
      });
      const dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${m.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
      return { metric: m, path, points, svg: `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}` };
    });

    // Direct end-labels at each line's last valid point — nudged apart
    // vertically if two or more would otherwise collide (lines converging
    // near the right edge), per usual "don't stack them" chart practice.
    const endPoints = lineLayers
      .map(l => l.points.length ? { color: l.metric.color, y: l.points[l.points.length - 1].y, v: weeks.map((w, i) => w.summary?.[l.metric.key]?.mean).filter(v => v != null).slice(-1)[0] } : null)
      .filter(Boolean)
      .sort((a, b) => a.y - b.y);
    for (let i = 1; i < endPoints.length; i++) {
      if (endPoints[i].y - endPoints[i - 1].y < 14) endPoints[i].y = endPoints[i - 1].y + 14;
    }
    const endLabelsSvg = endPoints.map(p => `
      <rect x="${W - PAD_R - 30}" y="${p.y - 9}" width="30" height="14" fill="var(--surface)" opacity="0.001"/>
      <text class="jt-trend-endlabel" x="${W - PAD_R - 2}" y="${p.y + 3}" text-anchor="end" fill="${p.color}">${p.v}m</text>
    `).join("");

    // ---- chart 2: cancellation rate, one bar per week, 0-100% fixed scale
    const plotH2 = H2 - PAD_T - PAD_B;
    const y2At = (pct) => PAD_T + (1 - pct / 100) * plotH2;
    const slotW = weeks.length > 1 ? plotW / weeks.length : plotW;
    const barW = Math.min(22, slotW * 0.55);
    const gridlines2 = [0, 25, 50, 75, 100].map(t => `
      <line class="jt-trend-gridline" x1="${PAD_L}" x2="${W - PAD_R}" y1="${y2At(t)}" y2="${y2At(t)}"/>
      <text class="jt-trend-axislabel" x="${PAD_L - 6}" y="${y2At(t) + 3}" text-anchor="end">${t}%</text>
    `).join("");
    const xLabels2 = weeks.map((w, i) => (i % thin === 0 || i === weeks.length - 1)
      ? `<text class="jt-trend-axislabel" x="${xAt(i)}" y="${H2 - 6}" text-anchor="${xAnchor(i)}">${esc(shortDate(w.weekStart))}</text>` : "").join("");
    const rates = weeks.map(w => w.totals?.total ? (w.totals.cancelled / w.totals.total) * 100 : null);
    // Rounded top, square at the baseline — a plain rx-rounded rect
    // rounds all four corners, which reads oddly where the bar meets
    // the axis, so this draws the outline by hand instead.
    function roundedTopBar(x, y, w, h) {
      const r = Math.min(4, w / 2, Math.max(h, 0));
      if (h <= 0) return "";
      return `M${x} ${y + h} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h} Z`;
    }
    const bars = weeks.map((w, i) => {
      const r = rates[i];
      if (r == null) return "";
      const x = xAt(i) - barW / 2, y = y2At(r), h = (PAD_T + plotH2) - y;
      return `<path d="${roundedTopBar(x, y, barW, h)}" fill="${CANCEL_COLOR}"/>`;
    }).join("");

    el.innerHTML = `
      <div class="jt-trend-head"><h3>Trend over time</h3></div>
      <div class="jt-trend-sub">${esc(shortDate(weeks[0].weekStart))} – ${esc(shortDate(weeks[weeks.length - 1].weekStart))} — hover a point for exact figures${weeks.some(w => !w.week) ? "; a gap means that week wasn't uploaded" : ""}.</div>
      <div class="jt-trend-legend">
        ${TREND_METRICS.map(m => `<span class="jt-trend-legend-item"><span class="jt-trend-swatch" style="background:${m.color}"></span>${esc(m.label)}</span>`).join("")}
      </div>
      <div class="jt-trend-charts" id="jtTrendCharts">
        <svg id="jtTrendSvg1" viewBox="0 0 ${W} ${H1}">
          ${gridlines1}${lineLayers.map(l => l.svg).join("")}${endLabelsSvg}${xLabels1}
          <line class="jt-trend-crosshair" id="jtCross1" x1="0" x2="0" y1="${PAD_T}" y2="${PAD_T + plotH1}"/>
        </svg>
        <div class="jt-trend-chart-label">Cancellation rate</div>
        <svg id="jtTrendSvg2" viewBox="0 0 ${W} ${H2}">
          ${gridlines2}${bars}${xLabels2}
          <line class="jt-trend-crosshair" id="jtCross2" x1="0" x2="0" y1="${PAD_T}" y2="${PAD_T + plotH2}"/>
        </svg>
        <div class="jt-trend-tooltip" id="jtTrendTooltip"></div>
      </div>
    `;

    // One shared hover: moving over either chart finds the nearest
    // week by x position and updates both crosshairs plus a single
    // tooltip listing every metric for that week — the pointer never
    // has to land exactly on a line or bar to get a value.
    const wrap = document.getElementById("jtTrendCharts");
    const cross1 = document.getElementById("jtCross1");
    const cross2 = document.getElementById("jtCross2");
    const tooltip = document.getElementById("jtTrendTooltip");
    const xs = weeks.map((w, i) => xAt(i));

    function showAt(i, clientX, clientY) {
      const w = weeks[i];
      const x = xs[i];
      cross1.setAttribute("x1", x); cross1.setAttribute("x2", x); cross1.style.opacity = 1;
      cross2.setAttribute("x1", x); cross2.setAttribute("x2", x); cross2.style.opacity = 1;
      const rate = rates[i];
      tooltip.innerHTML = `
        <div class="tt-week">${esc(w.week || shortDate(w.weekStart))}</div>
        ${TREND_METRICS.map(m => {
          const v = w.summary?.[m.key]?.mean;
          return `<div class="tt-row"><span class="tt-key" style="background:${m.color}"></span>${esc(m.label)}<span class="tt-val">${v != null ? v + "m" : "—"}</span></div>`;
        }).join("")}
        <div class="tt-row"><span class="tt-key" style="background:${CANCEL_COLOR}"></span>Cancellation rate<span class="tt-val">${rate != null ? Math.round(rate) + "%" : "—"}</span></div>
      `;
      const wrapRect = wrap.getBoundingClientRect();
      tooltip.style.left = `${clientX - wrapRect.left}px`;
      tooltip.style.top = `${clientY - wrapRect.top - 14}px`;
      tooltip.style.opacity = 1;
    }
    function hideTooltip() {
      cross1.style.opacity = 0; cross2.style.opacity = 0; tooltip.style.opacity = 0;
    }
    function nearestIndex(clientX, svgEl) {
      const rect = svgEl.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      let best = 0, bestDist = Infinity;
      xs.forEach((x, i) => { const d = Math.abs(x - relX); if (d < bestDist) { bestDist = d; best = i; } });
      return best;
    }
    [document.getElementById("jtTrendSvg1"), document.getElementById("jtTrendSvg2")].forEach(svg => {
      svg.addEventListener("mousemove", (e) => showAt(nearestIndex(e.clientX, svg), e.clientX, e.clientY));
      svg.addEventListener("mouseleave", hideTooltip);
    });
  }

  // Scoped to whichever week the toolbar below is currently showing —
  // not the whole upload history — so it always matches what the rest
  // of the page is displaying. Called from loadAndRenderWeek() each
  // time the week changes.
  function renderCancellationReasons(data) {
    const el = document.getElementById("jtReasons");
    const weekLabel = data?.week || "";
    const stats = data ? buildCancellationReasonStats([data]) : [];
    if (!stats.length) {
      el.innerHTML = `<div class="jt-reasons-head">
        <div class="jt-reasons-head-top"><h3>Cancellation reasons</h3></div>
        <div class="jt-reasons-sub">No cancelled cases ${data ? `this week${weekLabel ? ` (${esc(weekLabel)})` : ""}` : "— no data uploaded for this week"}.</div>
      </div>`;
      return;
    }
    const totalCancelled = stats.reduce((a, s) => a + s.count, 0);
    const max = stats[0].count;
    el.innerHTML = `
      <div class="jt-reasons-head">
        <div class="jt-reasons-head-top">
          <h3>Cancellation reasons</h3>
          <button type="button" class="btn btn-secondary btn-sm jt-no-print" id="jtReasonsPrintBtn">Print</button>
        </div>
        <div class="jt-reasons-sub">${totalCancelled} cancelled case${totalCancelled === 1 ? "" : "s"}${weekLabel ? ` — ${esc(weekLabel)}` : ""} — grouped by likely cause, since the same reason gets typed differently week to week</div>
      </div>
      <div class="jt-reasons-body">
        ${stats.map((s, i) => `
          <div class="jt-reason-row">
            <span class="jt-reason-rank">${i + 1}</span>
            <div class="jt-reason-main">
              <div class="jt-reason-top">
                <span class="jt-reason-label">${esc(s.label)}</span>
                <div class="jt-reason-bar-track"><div class="jt-reason-bar-fill" style="width:${Math.round((s.count / max) * 100)}%"></div></div>
                <span class="jt-reason-count">${s.count}</span>
              </div>
              <div class="jt-reason-examples">e.g. ${s.examples.map(e => `"${esc(e)}"`).join(" · ")}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("jtReasonsPrintBtn").addEventListener("click", () => window.print());
  }

  async function renderPage() {
    content.innerHTML = `
      <div class="jt-trend" id="jtTrend"></div>
      <div class="jt-reasons" id="jtReasons"></div>
      <div class="jt-toolbar">
        <button class="btn btn-secondary btn-sm" id="prevWeekBtn">‹ Previous week</button>
        <input type="date" id="weekDate">
        <button class="btn btn-secondary btn-sm" id="nextWeekBtn">Next week ›</button>
        <div class="spacer"></div>
      </div>
      <div id="jtBody"></div>
    `;
    renderTrend();
    const weekInput = document.getElementById("weekDate");
    weekInput.value = defaultWeekStart();

    document.getElementById("prevWeekBtn").addEventListener("click", () => {
      weekInput.value = mondayOf(isoPlusDays(weekInput.value, -7));
      loadAndRenderWeek();
    });
    document.getElementById("nextWeekBtn").addEventListener("click", () => {
      weekInput.value = mondayOf(isoPlusDays(weekInput.value, 7));
      loadAndRenderWeek();
    });
    weekInput.addEventListener("change", () => {
      weekInput.value = mondayOf(weekInput.value);
      loadAndRenderWeek();
    });

    await loadAndRenderWeek();

    async function loadAndRenderWeek() {
      const body = document.getElementById("jtBody");
      body.innerHTML = `<p style="color:var(--ink-500);">Loading…</p>`;
      const data = await loadJourneyWeek(profile.departmentId, weekInput.value);
      renderCancellationReasons(data);
      if (!data) {
        body.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <div class="es-title">No journey times uploaded for this week</div>
          <div class="es-sub">${profile.role === "admin" ? "Upload the week's spreadsheet in Administration." : "Ask your admin to upload it."}</div>
        </div>`;
        return;
      }
      renderDashboard(body, data);
    }
  }

  function renderDashboard(root, DATA) {
    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
    const METRICS = [
      { key: "d_sa", label: "Sent → Arrived", stat: "sent_arrived", scaleMax: null },
      { key: "d_si", label: "Started → Into theatre", stat: "started_into", scaleMax: null },
      { key: "d_ik", label: "Into theatre → Knife to skin", stat: "into_knife", scaleMax: null }
    ];
    METRICS.forEach(m => { m.scaleMax = Math.max(10, DATA.summary[m.stat].max || 10); });

    root.innerHTML = `
      <div class="jt-stats" id="jtStats"></div>
      <div class="jt-lb-section">
        <div class="jt-lb-title">Quickest this week</div>
        <div class="jt-lb-grid" id="jtLeaderboardFast"></div>
      </div>
      <div class="jt-lb-section">
        <div class="jt-lb-title">Longest this week</div>
        <div class="jt-lb-grid" id="jtLeaderboardSlow"></div>
      </div>
      <div class="jt-controls">
        <span class="grp-label">Day</span>
        <span id="jtDayChips"></span>
        <div class="spacer"></div>
        <label class="jt-toggle"><input type="checkbox" id="jtShowCancelled" checked> Show cancelled cases</label>
      </div>
      <div class="jt-table-wrap">
        <table class="jt-table">
          <thead><tr>
            <th data-sort="day">Day <span class="arrow">▾</span></th>
            <th data-sort="theatre">Theatre <span class="arrow">▾</span></th>
            <th data-sort="patient">Patient <span class="arrow">▾</span></th>
            <th data-sort="surg">Surgeon <span class="arrow">▾</span></th>
            <th data-sort="anaes">Anaes <span class="arrow">▾</span></th>
            <th data-sort="d_sa">Sent → Arrived <span class="arrow">▾</span></th>
            <th data-sort="d_si">Started → Into theatre <span class="arrow">▾</span></th>
            <th data-sort="d_ik">Into theatre → Knife <span class="arrow">▾</span></th>
            <th>Reason</th>
          </tr></thead>
          <tbody id="jtTbody"></tbody>
        </table>
      </div>
      <div class="jt-foot-note" id="jtFootNote"></div>
    `;

    document.getElementById("jtStats").innerHTML = METRICS.map(m => {
      const s = DATA.summary[m.stat];
      const flag = s.anomaly_count > 0
        ? `<div class="st-flag" title="Into theatre recorded before Started on these cases — likely a timestamp entry issue, excluded from the average so it isn't skewed by an impossible negative duration.">${s.anomaly_count} case${s.anomaly_count === 1 ? "" : "s"} flagged — check timestamps</div>`
        : "";
      return `<div class="jt-stat-card">
        <div class="st-label">${m.label}</div>
        <div class="st-value">${s.mean ?? "—"}<span class="unit">min avg</span></div>
        <div class="st-sub">Median ${s.median ?? "—"} · Range ${s.min ?? "—"}–${s.max ?? "—"} · n=${s.n}</div>
        ${flag}
      </div>`;
    }).join("");

    // Top 3 completed cases per metric, for the whole week — not
    // affected by the day-filter chips or the cancelled-cases toggle
    // below (those only narrow the table), since this is meant to read
    // as that week's own record, not a filtered view of it. Cancelled
    // cases have no duration to rank, and an "out of order" anomaly
    // (see durCell() below) isn't a real fast OR slow time, just a bad
    // timestamp, so both are left out here the same way they're left
    // out of the averages above. `slow` just swaps the sort direction
    // and gives the #1 spot a status-red badge instead of teal, since
    // that entry is the one worth looking at first.
    function buildLeaderboard(slow) {
      return METRICS.map(m => {
        const top3 = DATA.cases
          .filter(c => !c.cancelled && c[m.key] != null && c[m.key] >= 0)
          .slice()
          .sort((a, b) => slow ? b[m.key] - a[m.key] : a[m.key] - b[m.key])
          .slice(0, 3);
        const rows = top3.map((c, i) => `
          <li class="lb-row">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">${c.theatre} · ${c.patient}<span class="lb-sub">${c.day} · ${c.surg || "—"} / ${c.anaes || "—"}</span></span>
            <span class="lb-value">${c[m.key]}m</span>
          </li>`).join("");
        return `<div class="lb-card${slow ? " slow" : ""}">
          <div class="lb-cat">${m.label}</div>
          ${top3.length ? `<ul class="lb-list">${rows}</ul>` : `<p class="lb-empty">No completed cases yet</p>`}
        </div>`;
      }).join("");
    }
    document.getElementById("jtLeaderboardFast").innerHTML = buildLeaderboard(false);
    document.getElementById("jtLeaderboardSlow").innerHTML = buildLeaderboard(true);

    const activeDays = new Set(DAYS);
    const dayChips = document.getElementById("jtDayChips");
    function renderChips() {
      dayChips.innerHTML = DAYS.map(d =>
        `<button type="button" class="jt-chip ${activeDays.has(d) ? "on" : ""}" data-day="${d}">${d.slice(0,3)}</button>`
      ).join("");
    }
    dayChips.addEventListener("click", e => {
      const btn = e.target.closest("button[data-day]");
      if (!btn) return;
      const d = btn.dataset.day;
      if (activeDays.has(d)) activeDays.delete(d); else activeDays.add(d);
      renderChips();
      renderTable();
    });
    renderChips();

    const showCancelledEl = document.getElementById("jtShowCancelled");
    showCancelledEl.addEventListener("change", renderTable);

    let sortKey = null, sortDir = 1;
    document.querySelectorAll("table.jt-table thead th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
        document.querySelectorAll("table.jt-table thead th").forEach(t => t.classList.remove("sorted"));
        th.classList.add("sorted");
        th.querySelector(".arrow").textContent = sortDir === 1 ? "▾" : "▴";
        renderTable();
      });
    });

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    function durCell(c, m) {
      const v = c[m.key];
      if (c.cancelled) return `<span class="dur-missing">—</span>`;
      if (v == null) return `<span class="dur-missing">not recorded</span>`;
      if (v < 0) {
        return `<span class="dur-anomaly" title="Recorded ${Math.abs(v)} min out of order — the later step's timestamp came before the earlier one's. Excluded from the average above.">⚑ out of order</span>`;
      }
      const s = DATA.summary[m.stat];
      const high = s.p75 != null && v >= s.p75;
      const pct = Math.min(100, Math.round((v / m.scaleMax) * 100));
      return `<div class="dur-cell">
        <div class="dur-bar-track"><div class="dur-bar-fill ${high ? "high" : ""}" style="width:${pct}%"></div></div>
        <div class="dur-num ${high ? "high" : ""}">${v}m</div>
      </div>`;
    }

    function renderTable() {
      const showCancelled = showCancelledEl.checked;
      let rows = DATA.cases.filter(c => activeDays.has(c.day) && (showCancelled || !c.cancelled));
      if (sortKey) {
        rows = rows.slice().sort((a, b) => {
          let av = a[sortKey], bv = b[sortKey];
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === "string") return av.localeCompare(bv) * sortDir;
          return (av - bv) * sortDir;
        });
      }
      document.getElementById("jtTbody").innerHTML = rows.map(c => `
        <tr class="${c.cancelled ? "is-cancelled" : ""}">
          <td class="daycell">${c.day}</td>
          <td>${c.theatre}</td>
          <td>${c.patient}</td>
          <td>${c.surg || "—"}</td>
          <td>${c.anaes || "—"}</td>
          <td>${durCell(c, METRICS[0])}</td>
          <td>${durCell(c, METRICS[1])}</td>
          <td>${durCell(c, METRICS[2])}</td>
          <td class="reason-cell" title="${esc(c.reason || "")}">${c.cancelled ? `<span class="jt-cancelled-badge">CANCELLED</span> ` : ""}${c.reason || ""}</td>
        </tr>
      `).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--ink-300);padding:24px;">No cases match the current filters.</td></tr>`;
    }
    renderTable();

    document.getElementById("jtFootNote").innerHTML =
      `<b>Reading this:</b> bars are scaled per column, not against one shared axis, so each metric's own spread is visible. Amber marks a case at or above that column's 75th percentile (the slower quarter). Cancelled cases are shown greyed out with their logged reason, and don't count toward the averages above. Click a column header to sort; click a day chip to filter it out.`;
  }
</script>
</body>
</html>
