<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .rota-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .rota-toolbar input[type=date]{font-family:var(--font-body);padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--ink-150);}
  .rota-toolbar .spacer{flex:1;}
  .view-badge{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:var(--r-pill);background:var(--ink-100);color:var(--ink-500);}
  .view-badge.editing{background:var(--teal-100);color:var(--teal-700);}
  /* Bounded height + its own scrollbar, rather than letting the table
     grow tall and scroll with the rest of the page — that's what makes
     the sticky header below actually work. (A sticky element only
     sticks within its nearest scrolling ancestor; once this box scrolls
     internally, that ancestor is right here, not the whole page.) */
  .table-scroll{overflow-x:auto;overflow-y:auto;max-height:min(62vh,620px);background:var(--surface);
    border:1px solid var(--ink-150);border-radius:var(--r-lg);padding:4px;box-shadow:var(--shadow-sm);}
  table.rota-table{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.rota-table th{position:sticky;top:0;z-index:2;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-500);text-align:left;padding:10px 8px;border-bottom:1px solid var(--ink-150);white-space:nowrap;
    background:var(--teal-50);}
  table.rota-table th:first-child{border-top-left-radius:var(--r-md);}
  table.rota-table th:last-child{border-top-right-radius:var(--r-md);}
  table.rota-table td{padding:6px 8px;border-bottom:1px solid var(--ink-100);vertical-align:top;}
  table.rota-table tbody tr:hover td{background:var(--ink-100);}
  table.rota-table tr.today td{background:var(--teal-50);}
  table.rota-table tr.today:hover td{background:var(--teal-100);}
  table.rota-table td.daycell{font-weight:600;white-space:nowrap;}
  table.rota-table .bh{color:var(--status-oncall);font-weight:700;font-size:10px;}
   table.rota-table select{width:100%;min-width:118px;font-family:var(--font-body);font-size:12px;padding:4px;margin-bottom:2px;
    border:1px solid var(--ink-150);border-radius:4px;background:var(--surface);color:var(--ink-900);}
  table.rota-table select.is-placeholder{color:var(--ink-300);}

  table.rota-table th.theatre-col,table.rota-table th.support-col,table.rota-table th.oncall-col{min-width:130px;}
  table.rota-table .ro-field{display:block;padding:3px 0;font-size:12.5px;}
  .weekend-table{margin-top:20px;}
  h4.section-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin:22px 0 8px;}
  /* Print always renders from this separate, always-current copy of the
     grid (see renderOnly() below) rather than one built on the fly when
     Print preview is clicked — kept hidden on screen. */
  #printGridWrap{display:none;}
  .home-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-500);margin-top:2px;white-space:nowrap;}
  .home-check input{margin:0;}
  .home-badge{display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--teal-700);background:var(--teal-100);
    padding:2px 6px;border-radius:4px;margin-top:2px;}

  .cadex-badge{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9.5px;color:var(--ink-500);
    background:var(--ink-100);padding:2px 6px;border-radius:4px;margin-top:2px;flex-wrap:wrap;}
  .cadex-badge.cadex-match{color:var(--teal-700);background:var(--teal-100);}
  .cadex-badge.cadex-readonly{color:var(--ink-500);}
  .cadex-badge.cadex-unmatched{color:var(--status-turnover);background:var(--status-turnover-bg);}
  .cadex-apply{font-family:var(--font-body);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--teal-700);
    background:var(--surface);color:var(--teal-700);cursor:pointer;}
  .cadex-apply:hover{background:var(--teal-100);}

  @media print{
    .cadex-badge{display:none !important;}
    @page{ size: A4 landscape; margin: 8mm; }
    #shellRoot .app-sidebar,#shellRoot .app-topbar,.rota-toolbar{display:none !important;}
    #shellRoot .app-main,#shellRoot .app-content{overflow:visible !important;height:auto !important;padding:0 !important;}
    body{background:#fff;}
    .print-header{display:flex !important;margin-bottom:8px;padding-bottom:5px;}
    .print-header .ph-org{font-size:14px;}
    .table-scroll{border:none;overflow:visible;max-height:none;padding:0;box-shadow:none;}
    #screenGridWrap{display:none !important;}
    #printGridWrap{display:block !important;}

    /* A real grid, not a list of rows — every cell gets a border, and
       fixed layout plus 100% width means the table can never run wider
       than the printable page (the failure mode that used to clip the
       Coordinator column off the edge of the nursing rota). The header
       shading uses print-color-adjust so it survives even though most
       browsers strip background colours from prints by default —
       everything else stays pure black-on-white on purpose, since a
       colour that DOES print usually prints as a barely-there grey. */
    table.rota-table{font-size:9.5px;table-layout:fixed;width:100%;text-transform:uppercase;}
    table.rota-table th,table.rota-table td{border:1px solid #000 !important;padding:3px 4px;}
    table.rota-table th{position:static;color:#000;background:#e0e0e0 !important;white-space:normal;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* .daycell is nowrap on screen (where there's room); in this much
       narrower print column "Monday 27th" needs to wrap onto two lines
       instead of overflowing into Theatre 1's cell. */
    table.rota-table th:first-child,table.rota-table td.daycell{width:64px;white-space:normal;}
    table.rota-table tr.today td{background:none !important;}
    table.rota-table .ro-field{padding:1px 0;font-size:9.5px;}
    table.rota-table .bh{font-size:8.5px;}
    .home-badge{border:1px solid #000;background:none !important;color:#000;}
    h4.section-title{margin:8px 0 4px;font-size:9px;color:#000;}
    .weekend-table{page-break-inside:avoid;margin-top:0;}
  }
  .print-header{display:none;align-items:baseline;justify-content:space-between;margin-bottom:14px;
    border-bottom:2px solid var(--ink-900);padding-bottom:8px;}
  .print-header.force-show{display:flex;}
  .print-header .ph-org{font-family:var(--font-display);font-weight:800;font-size:16px;}
  .print-header .ph-dept{font-size:12px;color:var(--ink-500);margin-top:2px;}
  .print-header .ph-week{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);text-align:right;}
</style>
</head>
<body>
<div id="shellRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { requireSession, blockBoardOnly } from "./js/auth.js";

  import { renderShell } from "./js/shell.js";
  import { getDepartment, listTheatres, listStaff, splitStaff, buildAnaesthetistInitialsMap } from "./js/department.js";
  import { loadWeek, saveWeek, mondayOfCurrentWeek, renderGrid, attachChangeHandlers } from "./js/rota.js";
  import { getCadexImports } from "./js/cadex.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

   const { user, profile } = await requireSession();
  await blockBoardOnly(profile);
  // Fired together, not one-after-another — none of these three reads
  // depends on another's result or on anything built below, so there's
  // no reason to pay for three separate round-trips in sequence.
  const deptPromise = getDepartment(profile.departmentId);
  const theatresPromise = listTheatres(profile.departmentId);
  const staffListPromise = listStaff(profile.departmentId);

  const dept = await deptPromise;
  profile.departmentName = dept?.name || "Department";
  const editable = ["editor", "admin"].includes(profile.role);

  const content = renderShell({ profile, activePage: "rota", title: "Rota" });

  function rotaSkeleton(rows) {
    const row = `<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink-100);">
      <div class="skeleton skeleton-text w-40" style="width:70px;flex-shrink:0;"></div>
      <div class="skeleton skeleton-text w-80" style="flex:1;"></div>
      <div class="skeleton skeleton-text w-60" style="flex:1;"></div>
      <div class="skeleton skeleton-text w-80" style="flex:1;"></div>
    </div>`;
    return `<div style="padding:6px 4px;">${row.repeat(rows)}</div>`;
  }

  content.innerHTML = `
    <div class="rota-toolbar">
      <button class="btn btn-secondary btn-sm" id="prevWeekBtn">‹ Previous week</button>
      <input type="date" id="weekDate">
      <button class="btn btn-secondary btn-sm" id="nextWeekBtn">Next week ›</button>
      <button class="btn btn-secondary btn-sm" id="thisWeekBtn" style="display:none;">This week</button>
      <span class="view-badge ${editable ? "editing" : ""}">${editable ? "Editing" : "Read only"}</span>
      <div class="spacer"></div>
      <button class="btn btn-secondary btn-sm" id="fullWeekBtn">Full week view</button>
      <button class="btn btn-secondary btn-sm" id="printBtn">Print preview</button>
      <span id="editButtons">
        ${editable ? `<button class="btn btn-ghost btn-sm" id="clearBtn">Clear week</button>
                      <button class="btn btn-secondary btn-sm" id="saveDraftBtn">Save draft</button>
                      <button class="btn btn-primary btn-sm" id="publishBtn">Publish</button>` : ""}
      </span>
    </div>
    <div class="print-header" id="printHeader">
      <div>
        <div class="ph-org" id="phOrg"></div>
        <div class="ph-dept" id="phDept"></div>
      </div>
      <div class="ph-week" id="phWeek"></div>
    </div>
    <div id="screenGridWrap">
      <div class="table-scroll"><div id="weekdayGrid">${rotaSkeleton(5)}</div></div>
      <h4 class="section-title">Weekend</h4>
      <div class="table-scroll"><div id="weekendGrid">${rotaSkeleton(2)}</div></div>
    </div>
    <div id="printGridWrap">
      <div class="table-scroll"><div id="printWeekdayGrid"></div></div>
      <h4 class="section-title">Weekend</h4>
      <div class="table-scroll"><div id="printWeekendGrid"></div></div>
    </div>
  `;

   const theatres = await theatresPromise;
  const staffList = await staffListPromise;
  const staff = splitStaff(staffList);
  const anaesInitials = buildAnaesthetistInitialsMap(staffList);

  const weekInput = document.getElementById("weekDate");
  const thisWeekBtn = document.getElementById("thisWeekBtn");
  weekInput.value = mondayOfCurrentWeek();

  // Weeks are always keyed by their Monday in Firestore — normalizing
  // any manually-picked date to that date's own Monday means picking a
  // Wednesday, say, still shows the right week instead of silently
  // looking for a week that starts on a Wednesday (which never exists).
  function mondayOf(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = (d.getDay() + 6) % 7; // Monday=0 .. Sunday=6
    d.setDate(d.getDate() - day);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }
  function shiftWeek(deltaDays) {
    const d = new Date(weekInput.value + "T00:00:00");
    d.setDate(d.getDate() + deltaDays);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    weekInput.value = `${y}-${m}-${dd}`;
  }
  // "This week" is only useful once you've navigated away from it.
  function updateThisWeekBtn() {
    thisWeekBtn.style.display = weekInput.value === mondayOfCurrentWeek() ? "none" : "";
  }

  let rota = {};
  let cadexDays = null; // this week's imported CADEX data, keyed by lowercase day — see js/cadex.js
  let previewMode = false; // Full week view: read-only, print-styled, on screen

  function toast(msg, isError) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.classList.remove("show"), 2400);
  }

  function updatePrintHeader() {
    document.getElementById("phOrg").textContent = dept.hospitalName || "";
    document.getElementById("phDept").textContent = dept.name || profile.departmentName || "";
    const mon = new Date(weekInput.value + "T00:00:00");
    const fmt = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    document.getElementById("phWeek").textContent = `Week commencing ${fmt(mon)}`;
  }

  // Re-renders the grid from the in-memory `rota` object only — no
  // Firestore round-trip. This is what makes a selection in one theatre
  // immediately disappear from the other theatres' dropdowns.
  function renderOnly() {
    const showEditable = editable && !previewMode;

    document.getElementById("printHeader").classList.toggle("force-show", previewMode);
    document.getElementById("editButtons").style.display = previewMode ? "none" : "";
    updatePrintHeader();

    if (!theatres.length) {
      document.getElementById("weekdayGrid").innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M14 11.5v1"/></svg>
        <div class="es-title">No theatres set up yet</div>
        <div class="es-sub">${profile.role === "admin" ? "Add them in Administration." : "Ask your admin to add them."}</div>
      </div>`;
      document.getElementById("weekendGrid").innerHTML = "";
      document.getElementById("printWeekdayGrid").innerHTML = "";
      document.getElementById("printWeekendGrid").innerHTML = "";
      return;
    }

    const { weekdayHtml, weekendHtml } = renderGrid({
      weekStart: weekInput.value, dept, theatres, staff, rota, editable: showEditable, cadex: cadexDays, anaesInitials
    });
    document.getElementById("weekdayGrid").innerHTML = weekdayHtml;
    document.getElementById("weekendGrid").innerHTML = weekendHtml;

    if (showEditable) {
      attachChangeHandlers(document.getElementById("weekdayGrid"), rota, renderOnly);
      attachChangeHandlers(document.getElementById("weekendGrid"), rota, renderOnly);
    }

    // The print copy always uses the read-only rendering, independent of
    // Full week view / edit mode, and is kept continuously up to date
    // here rather than built on demand when Print preview is clicked —
    // so that click never needs to touch the DOM at all, and
    // window.print() can fire immediately and synchronously (see the
    // printBtn handler below for why that matters).
    const printCopy = renderGrid({ weekStart: weekInput.value, dept, theatres, staff, rota, editable: false });
    document.getElementById("printWeekdayGrid").innerHTML = printCopy.weekdayHtml;
    document.getElementById("printWeekendGrid").innerHTML = printCopy.weekendHtml;
  }

  async function loadAndRender() {
    const [week, imports] = await Promise.all([
      loadWeek(profile.departmentId, weekInput.value),
      getCadexImports(profile.departmentId, weekInput.value)
    ]);
    rota = week.data || {};
    cadexDays = imports?.days || null;
    renderOnly();
  }

  weekInput.addEventListener("change", () => {
    weekInput.value = mondayOf(weekInput.value);
    updateThisWeekBtn();
    loadAndRender();
  });
  document.getElementById("prevWeekBtn").addEventListener("click", () => {
    shiftWeek(-7);
    updateThisWeekBtn();
    loadAndRender();
  });
  document.getElementById("nextWeekBtn").addEventListener("click", () => {
    shiftWeek(7);
    updateThisWeekBtn();
    loadAndRender();
  });
  thisWeekBtn.addEventListener("click", () => {
    weekInput.value = mondayOfCurrentWeek();
    updateThisWeekBtn();
    loadAndRender();
  });

  if (editable) {
    document.getElementById("saveDraftBtn").addEventListener("click", async () => {
      try { await saveWeek(profile.departmentId, weekInput.value, rota, false, user.uid, theatres, profile.displayName); toast("Draft saved"); }
      catch (e) { toast("Couldn't save — try again", true); }
    });
    document.getElementById("publishBtn").addEventListener("click", async () => {
      try { await saveWeek(profile.departmentId, weekInput.value, rota, true, user.uid, theatres, profile.displayName); toast("Published"); }
      catch (e) { toast("Couldn't publish — try again", true); }
    });
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("Clear every box in this week's rota? This can't be undone until you save again.")) return;
      rota = {};
      renderOnly();
      toast("Week cleared — remember to save or publish");
    });
  }

  document.getElementById("fullWeekBtn").addEventListener("click", (e) => {
    previewMode = !previewMode;
    e.target.textContent = previewMode ? "Back to editing" : "Full week view";
    renderOnly();
  });

  // Print preview: #printGridWrap already holds a current, read-only
  // rendering (renderOnly() above keeps it that way on every change) and
  // CSS swaps it in for #screenGridWrap only under @media print — so
  // there is nothing left to do here but print. That matters: Safari
  // only treats window.print() as a genuine response to the click if
  // it's called synchronously, in the same tick, with no DOM work first
  // — deferring it, or mutating the DOM right before it, both risk
  // losing that and having it take the better part of a minute to open
  // the dialog instead of doing so immediately.
  document.getElementById("printBtn").addEventListener("click", () => {
    window.print();
  });

  await loadAndRender();
</script>
</body>
</html>
