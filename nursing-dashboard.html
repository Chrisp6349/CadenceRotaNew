<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — Nursing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cadence.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  .strip-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .bh-banner{display:flex;align-items:center;gap:8px;background:var(--status-oncall-bg);color:var(--status-oncall);
    font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:var(--r-sm);margin-bottom:16px;}
  .theatre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:24px;}
  .theatre-card{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-md);padding:14px;
    border-left:3px solid var(--card-accent, var(--ink-150));box-shadow:var(--shadow-sm);}
  .tc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .tc-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tc-head .dot.available{background:var(--status-available);}
  .tc-head .dot.inlist{background:var(--status-inlist);animation:pulse-dot 1.8s infinite;}
  .tc-head .dot.closed{background:var(--status-closed);}
  .tc-name{font-weight:700;font-size:13.5px;flex:1;}
  .tc-list{font-family:var(--font-mono);font-size:10px;background:var(--ink-100);color:var(--ink-500);
    padding:2px 6px;border-radius:4px;flex-shrink:0;}
  .tc-row{font-size:12.5px;color:var(--ink-700);padding:2px 0;}
  .tc-row.tc-surgeon{font-weight:600;color:var(--ink-900);}
  .tc-empty{font-size:12.5px;color:var(--ink-300);font-style:italic;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:8px;}
  .empty-note{color:var(--ink-500);font-size:13.5px;padding:20px 0;}

  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .week-nav button{background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-sm);
    padding:7px 12px;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-700);cursor:pointer;}
  .week-nav button:hover{background:var(--ink-100);}
  .week-nav-label{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);flex:1;text-align:center;}
  .week-nav .this-week-btn{color:var(--teal-600);border-color:var(--teal-100);}

  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
  .day-tab{flex-shrink:0;background:var(--surface);border:1px solid var(--ink-150);border-radius:var(--r-pill);
    padding:7px 14px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--ink-700);
    cursor:pointer;white-space:nowrap;}
  .day-tab:hover{background:var(--ink-100);}
  .day-tab.active{background:var(--teal-600);color:#fff;border-color:var(--teal-600);}
  .day-tab.is-today:not(.active){border-color:var(--teal-500);color:var(--teal-700);}

  .myweek-card{margin-top:24px;}
  .myweek-select-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .myweek-select-row select{font-family:var(--font-body);font-size:13.5px;padding:9px 12px;border-radius:var(--r-sm);
    border:1px solid var(--ink-150);background:var(--surface);color:var(--ink-900);min-width:220px;}
  .myweek-hi{font-family:var(--font-display);font-weight:800;font-size:16px;}
  .myweek-change{background:none;border:none;color:var(--teal-600);font-size:12px;font-weight:600;cursor:pointer;
    text-decoration:underline;padding:0;}
  .myweek-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px;}
  .myweek-day{background:var(--canvas);border:1px solid var(--ink-150);border-radius:var(--r-sm);padding:10px;}
  .myweek-day.today{border-color:var(--teal-500);background:var(--teal-50);}
  .myweek-day .md-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);text-transform:uppercase;margin-bottom:5px;}
  .myweek-day .md-role{font-size:12.5px;font-weight:600;color:var(--ink-900);}
  .myweek-day .md-off{font-size:12.5px;color:var(--ink-300);font-style:italic;}

  .tb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .tb-toggle{background:none;border:none;color:var(--teal-600);font-size:12px;font-weight:600;
    cursor:pointer;padding:0;text-decoration:underline;}
  .tb-list{display:flex;flex-direction:column;gap:12px;max-height:280px;overflow-y:auto;margin-bottom:14px;padding-right:4px;}
  .tb-msg{display:flex;gap:10px;align-items:flex-start;}
  .tb-avatar{width:28px;height:28px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:10.5px;flex-shrink:0;}
  .tb-body{flex:1;min-width:0;}
  .tb-meta{font-size:11px;color:var(--ink-500);margin-bottom:2px;}
  .tb-meta strong{color:var(--ink-700);font-weight:600;}
  .tb-text{font-size:13.5px;color:var(--ink-900);line-height:1.45;overflow-wrap:break-word;}
  .tb-del{background:none;border:none;color:var(--ink-300);cursor:pointer;font-size:15px;line-height:1;padding:2px;flex-shrink:0;}
  .tb-del:hover{color:var(--status-oncall);}
  .tb-form{display:flex;gap:8px;}
  .tb-form input{flex:1;font-family:var(--font-body);font-size:13.5px;padding:9px 14px;border-radius:var(--r-pill);
    border:1px solid var(--ink-150);background:var(--surface);color:var(--ink-900);}
  .tb-date-group{margin-bottom:18px;}
  .tb-date-group:last-child{margin-bottom:0;}
  .tb-date-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:8px;}
</style>
</head>
<body>
<div id="shellRoot"></div>

<script type="module">
    import { requireSession, blockBoardOnly } from "./js/auth.js";

  import { renderShell } from "./js/shell.js";
  import { getDepartment, listTheatres, listStaff, splitStaff } from "./js/department.js";
  import { loadNursingWeek } from "./js/nursing-rota.js";
  import { mondayOfCurrentWeek } from "./js/rota.js";
  import { postMessage, deleteMessage, watchTodayMessages, loadArchive, buildArchiveGroups } from "./js/messages.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

    const { user, profile } = await requireSession();
  await blockBoardOnly(profile);
  // Fired together, not one-after-another — see dashboard.html for the
  // same pattern and why.
  const deptPromise = getDepartment(profile.departmentId);
  const theatresPromise = listTheatres(profile.departmentId);
  const staffListPromise = listStaff(profile.departmentId);

  const dept = await deptPromise;
  profile.departmentName = dept?.name || "Department";

  const content = renderShell({ profile, activePage: "nursingDashboard", title: "Nursing Dashboard" });

  const theatres = await theatresPromise;
  const staffList = await staffListPromise;
  const staff = splitStaff(staffList);

   // My Week picker covers everyone who can appear on the nursing rota —
  // any banded nurse type, HCAs, and surgeons — not just one type, since
  // everyone wants to check their own week too.
  const myWeekStaff = staffList.filter(s => ["nurse", "nurse_band5", "nurse_band6", "nurse_aptap", "hca", "surgeon"].includes(s.type));

  const ALL_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  function localIso(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  const todayIso = localIso(new Date());
  const todayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];

  const params = new URLSearchParams(window.location.search);
  const linkedWeek = params.get("week");
  const linkedDay = params.get("day");

  let weekOffset = 0;
  let selectedDayIdx = ALL_DAYS.indexOf(todayName);
  let rota = {};
  let loadError = null;

  if (linkedWeek) {
    const currentMonday = new Date(mondayOfCurrentWeek() + "T00:00:00");
    const linkedMonday = new Date(linkedWeek + "T00:00:00");
    weekOffset = Math.round((linkedMonday - currentMonday) / (7 * 86400000));
    if (linkedDay !== null && !isNaN(Number(linkedDay))) selectedDayIdx = Number(linkedDay);
  }

  function weekStartIso(offset) {
    const d = new Date(mondayOfCurrentWeek() + "T00:00:00");
    d.setDate(d.getDate() + offset * 7);
    return localIso(d);
  }
  function isoPlusDays(mondayIso, i) {
    const d = new Date(mondayIso + "T00:00:00");
    d.setDate(d.getDate() + i);
    return d;
  }
  function shortDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  function longDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); }

  async function loadRota() {
    try {
      const week = await loadNursingWeek(profile.departmentId, weekStartIso(weekOffset));
      rota = week.data || {};
      loadError = null;
    } catch (err) {
      loadError = err;
    }
  }

  // ---- Theatre status (for the currently selected day) -------------------
  function theatreInfo(day, t) {
    const nurses = [1, 2, 3, 4].map(n => rota[`${day}_${t.id}_nurse${n}`]).filter(Boolean);
    const hcas = [1, 2].map(n => rota[`${day}_${t.id}_hca${n}`]).filter(Boolean);
    const surgeon = rota[`${day}_${t.id}_surgeon`] || "";
    const listType = rota[`${day}_${t.id}_list`] || "";
    const hasList = !!(nurses.length || hcas.length || surgeon);
    let status = "available";
    if (hasList) status = (listType.includes("NO LIST") || listType.includes("NO SURGEON")) ? "closed" : "inlist";
    return { nurses, hcas, surgeon, listType, status };
  }

  // ---- My Week -------------------------------------------------------------
  const MYWEEK_KEY = `cadence_nursing_myweek_${profile.departmentId}`;

  function describePlacement(suffix, t) {
    let m = suffix.match(/^(.+)_nurse([1-4])$/);
    if (m) {
      if (m[1] === "oncall") return "On call · Nurse";
      if (m[1] === "wl") return "Weekend waiting list · Nurse";
      if (m[1] === "support") return "Support · Nurse";
      const th = theatres.find(x => x.id === m[1]);
      return th ? `${th.name} · Nurse` : null;
    }
    m = suffix.match(/^(.+)_hca[12]?$/);
    if (m) {
      if (m[1] === "oncall") return "On call · HCA";
      if (m[1] === "wl") return "Weekend waiting list · HCA";
      if (m[1] === "support") return "Support · HCA";
      const th = theatres.find(x => x.id === m[1]);
      return th ? `${th.name} · HCA` : null;
    }
    if (suffix === "oncall_surgeon_thoracic") return "On call · Surgeon (Thoracic)";
    m = suffix.match(/^(.+)_surgeon$/);
    if (m) {
      if (m[1] === "oncall") return "On call · Surgeon (Cardiac)";
      if (m[1] === "wl") return "Weekend waiting list · Surgeon";
      const th = theatres.find(x => x.id === m[1]);
      return th ? `${th.name} · Surgeon` : null;
    }
    if (suffix === "coordinator") return "Coordinator";
    return null;
  }

  function placementsForDay(day, name) {
    const found = [];
    Object.entries(rota).forEach(([k, v]) => {
      if (v !== name || !k.startsWith(day + "_")) return;
      const label = describePlacement(k.slice(day.length + 1));
      if (label) found.push(label);
    });
    return found;
  }

  function renderMyWeekResult(name) {
    const dayCards = ALL_DAYS.map((day, i) => {
      const d = isoPlusDays(weekStartIso(weekOffset), i);
      const isDayToday = localIso(d) === todayIso;
      const placements = placementsForDay(day, name);
      const body = placements.length
        ? placements.map(p => `<div class="md-role">${p}</div>`).join("")
        : `<div class="md-off">Not rostered</div>`;
      return `<div class="myweek-day${isDayToday ? " today" : ""}">
        <div class="md-label">${day.slice(0, 3)} ${shortDate(d)}</div>
        ${body}
      </div>`;
    }).join("");

    document.getElementById("myweekCard").innerHTML = `
      <div class="myweek-select-row">
        <span class="myweek-hi">${name}</span>
        <button class="myweek-change" id="myweekChangeBtn">Not you? Switch name</button>
      </div>
      <div class="myweek-days">${dayCards}</div>
    `;
    document.getElementById("myweekChangeBtn").addEventListener("click", () => {
      localStorage.removeItem(MYWEEK_KEY);
      renderMyWeekPicker();
    });
  }

   const TYPE_LABELS = { nurse: "Nurse", nurse_band5: "Band 5 Nurse", nurse_band6: "Band 6 Nurse", nurse_aptap: "AP/TAP", hca: "HCA", surgeon: "Surgeon" };

  function renderMyWeekPicker() {
    const sorted = [...myWeekStaff].sort((a, b) => a.name.localeCompare(b.name));
    const options = sorted.map(s => `<option value="${s.name}">${s.name} (${TYPE_LABELS[s.type]})</option>`).join("");
    document.getElementById("myweekCard").innerHTML = `
      <div class="myweek-select-row">
        <select id="myweekSelect">
          <option value="">Select your name…</option>
          ${options}
        </select>
      </div>
    `;
    document.getElementById("myweekSelect").addEventListener("change", (e) => {
      if (!e.target.value) return;
      localStorage.setItem(MYWEEK_KEY, e.target.value);
      renderMyWeekResult(e.target.value);
    });
  }

  function initMyWeek() {
    const saved = localStorage.getItem(MYWEEK_KEY);
    if (saved && myWeekStaff.some(s => s.name === saved)) {
      renderMyWeekResult(saved);
    } else {
      renderMyWeekPicker();
    }
  }

  // ---- Team Board -----------------------------------------------------
  // Nursing's own board — a separate Firestore collection
  // (departments/{deptId}/nursingMessages) from the ODP dashboard's
  // "messages", so the two are fully independent: a post here never
  // shows up there and vice versa. Live-updating via watchTodayMessages
  // below; archive is fetched once on demand and cached for this visit.
  const NURSING_MESSAGES = "nursingMessages";
  let todayMessages = [];
  let boardMode = "today"; // "today" | "archive"
  let archiveGroups = null;
  let tbError = null;

  function initials(name) {
    return (name || "?").split(" ").map(s => s[0]).slice(0, 2).join("").toUpperCase();
  }
  function formatMsgTime(ts, clientTime) {
    if (ts?.toDate) return ts.toDate().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    if (clientTime) return new Date(clientTime).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    return "sending…";
  }
  // Message text is always set via textContent after insertion (see the
  // two loops below), never interpolated into the HTML string — so a
  // posted message can never be interpreted as markup.
  function msgRowHtml(id, displayName, createdAt, clientTime, canDelete) {
    return `<div class="tb-msg">
      <div class="tb-avatar">${initials(displayName)}</div>
      <div class="tb-body">
        <div class="tb-meta"><strong>${displayName || "Someone"}</strong> · ${formatMsgTime(createdAt, clientTime)}</div>
        <div class="tb-text" data-msg-id="${id}"></div>
      </div>
      ${canDelete ? `<button class="tb-del" data-del="${id}" title="Delete">×</button>` : ""}
    </div>`;
  }

  async function toggleBoardMode() {
    boardMode = boardMode === "today" ? "archive" : "today";
    renderTeamBoard();
    if (boardMode === "archive" && !archiveGroups) {
      const msgs = await loadArchive(profile.departmentId, todayIso, 300, NURSING_MESSAGES);
      archiveGroups = buildArchiveGroups(msgs);
      renderTeamBoard();
    }
  }

  function renderTeamBoard() {
    const el = document.getElementById("teamBoardCard");
    if (!el) return;

    if (tbError) {
      el.innerHTML = `<div class="tb-head"><span class="strip-label" style="margin:0;">Team Board</span></div>
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <div class="es-title">Live updates aren't connecting</div>
          <div class="es-sub">${tbError.code || tbError.message || String(tbError)}</div>
        </div>`;
      return;
    }

    const headHtml = `<div class="tb-head"><span class="strip-label" style="margin:0;">Team Board</span>
      <button class="tb-toggle" id="tbToggleBtn">${boardMode === "today" ? "Archive" : "Today"}</button></div>`;

    if (boardMode === "archive") {
      let bodyHtml;
      if (!archiveGroups) {
        bodyHtml = `<div class="skeleton skeleton-text w-40"></div><div class="skeleton skeleton-text w-80" style="margin-top:10px;"></div>`;
      } else if (!archiveGroups.length) {
        bodyHtml = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M15 4v5h5"/></svg>
          <div class="es-title">Nothing archived yet</div>
          <div class="es-sub">Once today ends, anything posted here moves into the archive automatically.</div>
        </div>`;
      } else {
        bodyHtml = `<div class="tb-list" style="max-height:340px;">${archiveGroups.map(g => `
          <div class="tb-date-group">
            <div class="tb-date-label">${new Date(g.dateKey + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</div>
            ${g.messages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, false)).join("")}
          </div>`).join("")}</div>`;
      }
      el.innerHTML = headHtml + bodyHtml;
      if (archiveGroups) {
        archiveGroups.flatMap(g => g.messages).forEach(m => {
          const node = el.querySelector(`[data-msg-id="${m.id}"]`);
          if (node) node.textContent = m.text;
        });
      }
    } else {
      const listHtml = todayMessages.length
        ? `<div class="tb-list">${todayMessages.map(m => msgRowHtml(m.id, m.displayName, m.createdAt, m.clientTime, m.uid === user.uid || profile.role === "admin")).join("")}</div>`
        : `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-9.9 8.25 8.5 8.5 0 01-6.32-3.17L3 21l1.42-4.24a8.5 8.5 0 01-.9-3.76 8.38 8.38 0 018.25-9.9 8.5 8.5 0 018.23 8.4z"/></svg>
            <div class="es-title">No messages yet today</div>
            <div class="es-sub">First to know something worth sharing? Post it below.</div>
          </div>`;
      el.innerHTML = `${headHtml}${listHtml}
        <form class="tb-form" id="tbForm">
          <input type="text" id="tbInput" placeholder="Share something with the team…" maxlength="500" autocomplete="off">
          <button class="btn btn-primary btn-sm" type="submit">Post</button>
        </form>`;
      todayMessages.forEach(m => {
        const node = el.querySelector(`[data-msg-id="${m.id}"]`);
        if (node) node.textContent = m.text;
      });

      el.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this message?")) return;
          await deleteMessage(profile.departmentId, btn.dataset.del, NURSING_MESSAGES);
        });
      });
      document.getElementById("tbForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("tbInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        try {
          await postMessage(profile.departmentId, user.uid, profile.displayName || "Someone", text, todayIso, NURSING_MESSAGES);
        } catch (err) {
          tbError = err;
          renderTeamBoard();
        }
      });
      const listEl = el.querySelector(".tb-list");
      if (listEl) listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById("tbToggleBtn").addEventListener("click", toggleBoardMode);
  }

  // ---- Main render ---------------------------------------------------------
  function render() {
    if (loadError) {
      content.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div class="es-title">Couldn't load the nursing dashboard</div>
        <div class="es-sub">${loadError.code === "permission-denied" ? "Your account doesn't have access to this yet — check Firestore rules include nursingWeeks." : "Check your connection and try reloading."}</div>
      </div>`;
      return;
    }
    const day = ALL_DAYS[selectedDayIdx];
    const isWeekend = day === "Saturday" || day === "Sunday";
    const dayIso = localIso(isoPlusDays(weekStartIso(weekOffset), selectedDayIdx));
    const isActualToday = dayIso === todayIso;

    const weekLabel = `Week commencing ${longDate(isoPlusDays(weekStartIso(weekOffset), 0))}`;
    const weekNavHtml = `
      <div class="week-nav">
        <button id="prevWeekBtn">‹ Previous week</button>
        <span class="week-nav-label">${weekLabel}</span>
        ${weekOffset !== 0 ? `<button class="this-week-btn" id="thisWeekBtn">This week</button>` : ""}
        <button id="nextWeekBtn">Next week ›</button>
      </div>
    `;

    const dayTabsHtml = `<div class="day-tabs">${ALL_DAYS.map((d, i) => {
      const iso = localIso(isoPlusDays(weekStartIso(weekOffset), i));
      const isTabToday = iso === todayIso;
      return `<button class="day-tab${i === selectedDayIdx ? " active" : ""}${isTabToday ? " is-today" : ""}" data-day-idx="${i}">
        ${d.slice(0, 3)} ${shortDate(isoPlusDays(weekStartIso(weekOffset), i))}
      </button>`;
    }).join("")}</div>`;

    // Theatre grid — only real Mon-Fri; weekends have no theatres on the
    // nursing rota, so show the weekend on-call/waiting-list cards instead.
    let theatreCardsHtml, sessionsCount = 0;
    if (isWeekend) {
      theatreCardsHtml = `<div class="empty-state" style="grid-column:1/-1;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M14 11.5v1"/></svg>
        <div class="es-title">No theatres on ${day}</div>
        <div class="es-sub">Weekends run on call and the waiting list only — see below.</div>
      </div>`;
    } else if (theatres.length) {
      theatreCardsHtml = theatres.map(t => {
        const info = theatreInfo(day, t);
        sessionsCount += info.status === "inlist" ? 1 : 0;
        const rows = [
          ...info.nurses.map(n => `<div class="tc-row">${n}</div>`),
          ...info.hcas.map(n => `<div class="tc-row">${n}</div>`),
          info.surgeon ? `<div class="tc-row tc-surgeon">${info.surgeon}</div>` : ""
        ].filter(Boolean).join("");
        const accent = { available: "var(--status-available)", inlist: "var(--status-inlist)", closed: "var(--status-closed)" }[info.status];
        return `<div class="theatre-card" style="--card-accent:${accent}">
          <div class="tc-head">
            <span class="dot ${info.status}"></span>
            <span class="tc-name">${t.name}</span>
            ${info.listType ? `<span class="tc-list">${info.listType}</span>` : ""}
          </div>
          ${rows || `<div class="tc-empty">No allocation</div>`}
        </div>`;
      }).join("");
    } else {
      theatreCardsHtml = `<div class="empty-state" style="grid-column:1/-1;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M14 11.5v1"/></svg>
        <div class="es-title">No theatres configured yet</div>
        <div class="es-sub">Add your theatres in Administration and they'll appear here.</div>
      </div>`;
    }

    const bhBanner = (dept.bankHolidays && dept.bankHolidays[dayIso])
      ? `<div class="bh-banner">${isActualToday ? "Today" : day} is a bank holiday</div>` : "";

    // On call and coordinator are day-level fields, same shape every day
    // of the week. The weekend waiting list only exists Sat/Sun.
    const onCallNurses = [1, 2, 3].map(n => rota[`${day}_oncall_nurse${n}`]).filter(Boolean).join(", ") || "—";
    const onCallHca = rota[`${day}_oncall_hca`] || "—";
    const onCallSurgeonCardiac = rota[`${day}_oncall_surgeon`] || "—";
    const onCallSurgeonThoracic = rota[`${day}_oncall_surgeon_thoracic`] || "—";
    const coordinator = !isWeekend ? (rota[`${day}_coordinator`] || "—") : null;

    const supportNurses = [1, 2].map(n => rota[`${day}_support_nurse${n}`]).filter(Boolean).join(", ") || "—";
    const supportHcas = [1, 2].map(n => rota[`${day}_support_hca${n}`]).filter(Boolean).join(", ") || "—";

    const wlNurses = isWeekend ? [1, 2, 3].map(n => rota[`${day}_wl_nurse${n}`]).filter(Boolean).join(", ") || "—" : null;
    const wlHca = isWeekend ? (rota[`${day}_wl_hca`] || "—") : null;
    const wlSurgeon = isWeekend ? (rota[`${day}_wl_surgeon`] || "—") : null;

    const STAT_ICONS = {
      sessions: `<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>`,
      support: `<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 13.2c2.3.3 4 2.2 4 4.8"/>`,
      coordinator: `<path d="M12 2l8 3v6c0 5-3.4 8.4-8 11-4.6-2.6-8-6-8-11V5l8-3z"/>`,
      oncall: `<path d="M4 4h4l2 5-2.5 1.5a11 11 0 005 5L14 13l5 2v4a2 2 0 01-2 2C9.5 21 3 14.5 3 6a2 2 0 011-2z"/>`,
      surgeon: `<path d="M6 4v6a4 4 0 008 0V4M10 14v3a4 4 0 004 4 4 4 0 004-4v-2"/><circle cx="19" cy="9" r="1.6"/>`
    };
    const statIcon = key => `<div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${STAT_ICONS[key]}</svg></div>`;

    const statCards = [];
    if (!isWeekend) {
      statCards.push(`<div class="card">${statIcon("sessions")}<div class="card-label">Sessions</div><div class="card-value">${sessionsCount} / ${theatres.length}</div></div>`);
      statCards.push(`<div class="card">${statIcon("support")}<div class="card-label">Support</div><div class="card-value" style="font-size:16px;">Nurses: ${supportNurses}<br>HCAs: ${supportHcas}</div></div>`);
      statCards.push(`<div class="card">${statIcon("coordinator")}<div class="card-label">Coordinator</div><div class="card-value" style="font-size:20px;">${coordinator}</div></div>`);
    }
       statCards.push(`<div class="card">${statIcon("oncall")}<div class="card-label">On call</div><div class="card-value" style="font-size:16px;">Nurses: ${onCallNurses}<br>HCA: ${onCallHca}</div></div>`);
    statCards.push(`<div class="card">${statIcon("surgeon")}<div class="card-label">On call surgeon (Cardiac)</div><div class="card-value" style="font-size:20px;">${onCallSurgeonCardiac}</div></div>`);
    statCards.push(`<div class="card">${statIcon("surgeon")}<div class="card-label">On call surgeon (Thoracic)</div><div class="card-value" style="font-size:20px;">${onCallSurgeonThoracic}</div></div>`);
    if (isWeekend) {
      statCards.push(`<div class="card">${statIcon("oncall")}<div class="card-label">Weekend waiting list</div><div class="card-value" style="font-size:16px;">Nurses: ${wlNurses}<br>HCA: ${wlHca}</div></div>`);
      statCards.push(`<div class="card">${statIcon("surgeon")}<div class="card-label">Weekend waiting list surgeon</div><div class="card-value" style="font-size:20px;">${wlSurgeon}</div></div>`);
    }


    content.innerHTML = `
      ${weekNavHtml}
      ${dayTabsHtml}
      ${bhBanner}
      <div class="card" id="teamBoardCard" style="margin-bottom:24px;"></div>
      <div class="strip-label">Live status — ${day}${isActualToday ? " (today)" : ""}</div>
      <div class="theatre-grid">${theatreCardsHtml}</div>
      <div class="stat-grid">${statCards.join("")}</div>
      <div class="strip-label myweek-card">My Week</div>
      <div class="card" id="myweekCard"></div>
    `;

    document.getElementById("prevWeekBtn").addEventListener("click", () => changeWeek(-1));
    document.getElementById("nextWeekBtn").addEventListener("click", () => changeWeek(1));
    const thisWeekBtn = document.getElementById("thisWeekBtn");
    if (thisWeekBtn) thisWeekBtn.addEventListener("click", () => changeWeek(0, true));
    document.querySelectorAll(".day-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedDayIdx = Number(btn.dataset.dayIdx);
        render();
      });
    });

    initMyWeek();
    renderTeamBoard();
  }

  async function changeWeek(delta, jumpToThisWeek) {
    weekOffset = jumpToThisWeek ? 0 : weekOffset + delta;
    if (jumpToThisWeek) selectedDayIdx = ALL_DAYS.indexOf(todayName);
    await loadRota();
    render();
  }

  await loadRota();
  render();

  // Live for as long as this page is open — a colleague posting on this
  // dashboard shows up here without a refresh. Only re-renders when in
  // "today" mode, since archive mode has its own separately-fetched,
  // cached data.
  watchTodayMessages(profile.departmentId, todayIso, (msgs) => {
    todayMessages = msgs;
    tbError = null;
    if (boardMode === "today") renderTeamBoard();
  }, NURSING_MESSAGES, (err) => {
    tbError = err;
    renderTeamBoard();
  });
</script>
</body>
</html>
